
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador - LUMINE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./style/admin_dashboard.css">
    <style>
        /* CSS Integrado para evitar que o gráfico suma por falta de dimensões */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; }
        header { background: #1595c4; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-btns button { padding: 8px 15px; cursor: pointer; border-radius: 5px; border: none; font-weight: bold; }
        
        .dashboard { padding: 20px; max-width: 1200px; margin: auto; }
        .cards-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: white; flex: 1; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card .numero { font-size: 2.5rem; font-weight: bold; color: #1595c4; margin: 10px 0; }
        .card button { background: #eee; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }

        .charts-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .chart-box { 
            background: white; 
            flex: 1; 
            min-width: 450px; 
            height: 350px; /* Altura fixa ajuda o gráfico a não sumir */
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            position: relative;
        }
        
        /* Modal e Tabela */
        #modal { display: none; position: fixed; z-index: 999; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 1000px; max-height: 80vh; overflow-y: auto; }
        .status-msg { padding: 10px; margin-bottom: 10px; border-radius: 4px; display: none; font-weight: bold; text-align: center; }
        .status-success { background: #d4edda; color: #155724; }
        .status-error { background: #f8d7da; color: #721c24; }
        
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .admin-table th { background-color: #1595c4; color: white; }
        
        /* Dificuldades */
        .tag-dificuldade { padding: 5px 12px; border-radius: 15px; color: white; font-weight: bold; font-size: 12px; display: inline-block; min-width: 90px; text-align: center; }
        .dif-facil { background-color: #28a745 !important; }
        .dif-intermediario { background-color: #ffc107 !important; color: #212529 !important; }
        .dif-dificil { background-color: #dc3545 !important; }
        
        .btn-excluir { background: #ff4d4d; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
        .btn-editar { background: #ffce56; color: #333; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h2>LUMINE Admin</h2>
    <div class="nav-btns">
        <button onclick="location.href='home.html'">Início</button>
        <button onclick="location.href='criar_quiz.html'" style="background: #a3e1ff;">+ Novo Quiz</button>
    </div>
</header>

<div class="dashboard">
    <div class="cards-container">
        <div class="card">
            <h3>Usuários</h3>
            <div class="numero" id="total-usuarios">0</div>
            <button onclick="abrirModal('usuários')">Gerenciar</button>
        </div>
        <div class="card">
            <h3>Quizzes</h3>
            <div class="numero" id="total-quizzes">0</div>
            <button onclick="abrirModal('quizzes')">Gerenciar</button>
        </div>
        <div class="card">
            <h3>Avaliações</h3>
            <div class="numero" id="total-avaliacoes">0</div>
            <button onclick="abrirModal('avaliacoes')">Visualizar</button>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-box"><canvas id="chartEscolaridade"></canvas></div>
        <div class="chart-box"><canvas id="chartCadastros"></canvas></div>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modal-titulo"></h2>
        <div id="status-feedback" class="status-msg"></div>
        <div id="modal-corpo"></div>
        <br>
        <button onclick="fecharModal()" style="padding: 10px 20px; cursor: pointer;">Fechar Janela</button>
    </div>
</div>

<script>
    let detalhesModais = {};
    let chart1 = null;
    let chart2 = null;

    async function carregarDados() {
        try {
            const res = await fetch('../config/admin_data.php');
            if (!res.ok) throw new Error("Erro na rede");
            const dados = await res.json();
            
            detalhesModais = dados.detalhes;

            document.getElementById('total-usuarios').innerText = dados.cards.usuarios || 0;
            document.getElementById('total-quizzes').innerText = dados.cards.quizzes || 0;
            document.getElementById('total-avaliacoes').innerText = dados.cards.avaliacoes || 0;

            if (chart1) chart1.destroy();
            if (chart2) chart2.destroy();

            // Gráfico 1
            const ctx1 = document.getElementById('chartEscolaridade').getContext('2d');
            chart1 = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: dados.graficoEscolaridade.labels || [],
                    datasets: [{ label: 'Alunos por Escolaridade', data: dados.graficoEscolaridade.valores || [], backgroundColor: '#1595c4' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // Gráfico 2
            const ctx2 = document.getElementById('chartCadastros').getContext('2d');
            chart2 = new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'],
                    datasets: [{ data: dados.graficoSemana || [0,0,0,0,0,0,0], backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#2ecc71', '#e67e22', '#95a5a6'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        } catch (error) { 
            console.error("Erro ao carregar dados:", error); 
        }
    }

    function abrirModal(tipo) {
        const titulo = document.getElementById('modal-titulo');
        const corpo = document.getElementById('modal-corpo');
        titulo.innerText = "Gerenciar " + tipo.charAt(0).toUpperCase() + tipo.slice(1);
        
        const dados = detalhesModais[tipo] || [];
        let html = "";

        if (tipo === 'usuários') {
            html = `<table class="admin-table">
                <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Ações</th></tr></thead>
                <tbody>`;
            dados.forEach(u => {
                html += `<tr id="row-user-${u.id}">
                    <td>${u.id}</td><td>${u.nome}</td><td>${u.email}</td>
                    <td><button class="btn-excluir" onclick="confirmarExclusao('usuario', ${u.id})">Excluir</button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
        } 
        else if (tipo === 'quizzes') {
            html = `<table class="admin-table">
                <thead>
                    <tr><th>Nome</th><th>Matéria</th><th>Conteúdo</th><th>Perguntas</th><th>Dificuldade</th><th>Ações</th></tr>
                </thead>
                <tbody>`;
            dados.forEach(q => {
                let cl = "";
                const d = q.nome_dificuldade.toLowerCase();
                if (d.includes("fác") || d.includes("fac")) cl = "dif-facil";
                else if (d.includes("inter")) cl = "dif-intermediario";
                else if (d.includes("dif")) cl = "dif-dificil";

                html += `<tr id="row-quiz-${q.id}">
                    <td>${q.nome_quiz}</td><td>${q.nome_materia}</td><td>${q.nome_conteudo}</td>
                    <td align="center">${q.total_perguntas}</td>
                    <td align="center"><span class="tag-dificuldade ${cl}">${q.nome_dificuldade}</span></td>
                    <td>
                        <button class="btn-editar" onclick="mostrarFeedback('Em breve...', 'success')">Editar</button>
                        <button class="btn-excluir" onclick="confirmarExclusao('quiz', ${q.id})">Excluir</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
        }
        corpo.innerHTML = html || "<p>Nenhum registro.</p>";
        document.getElementById('modal').style.display = 'flex';
    }

    function confirmarExclusao(tipo, id) {
        const div = document.getElementById('status-feedback');
        div.innerHTML = `Confirmar exclusão? 
            <button onclick="executarExclusao('${tipo}', ${id})" style="background:red; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Sim</button> 
            <button onclick="document.getElementById('status-feedback').style.display='none'" style="background:#666; color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Não</button>`;
        div.className = "status-msg status-error";
        div.style.display = "block";
    }

    async function executarExclusao(tipo, id) {
        try {
            const res = await fetch(`../config/excluir_adm.php?tipo=${tipo}&id=${id}`);
            const r = await res.json();
            if (r.status) {
                mostrarFeedback("Removido com sucesso!", "success");
                document.getElementById(`row-${tipo==='usuario'?'user':'quiz'}-${id}`).style.display = 'none';
                carregarDados();
            } else { mostrarFeedback("Erro: " + r.erro, "error"); }
        } catch (e) { mostrarFeedback("Erro de conexão.", "error"); }
    }

    function fecharModal() { 
        document.getElementById('modal').style.display = 'none'; 
        document.getElementById('status-feedback').style.display = 'none';
    }
    
    carregarDados();
</script>
</body>
</html>
