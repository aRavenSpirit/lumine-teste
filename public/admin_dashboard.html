<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador - LUMINE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./style/admin_dashboard.css">
    <style>
        /* Estilos para Feedback na Interface */
        .status-msg { padding: 10px; margin-bottom: 10px; border-radius: 4px; display: none; font-weight: bold; text-align: center; }
        .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        /* Estilos da Tabela */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; color: #333; }
        .admin-table th, .admin-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .admin-table th { background-color: #1595c4; color: white; position: sticky; top: 0; }
        
        .btn-excluir { background: #ff4d4d; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-editar { background: #ffce56; color: #333; border: none; padding: 6px 12px; cursor: pointer; border-radius: 4px; margin-right: 5px; font-weight: bold; }
        
        .modal-content { width: 90% !important; max-width: 1000px !important; border-radius: 15px; background: white; padding: 25px; }
        #modal-corpo { max-height: 450px; overflow-y: auto; margin-top: 15px; }

        /* Overlay do Modal */
        #modal { display:none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
    </style>
</head>
<body>

<header>
    <h2>LUMINE Admin</h2>
    <div class="nav-btns">
        <button onclick="location.href='home.html'">Início</button>
        <button onclick="location.href='criar_quiz.html'" style="background: #a3e1ff;">+ Novo Quiz</button>
    </div>
</header>

<div class="dashboard">
    <div class="cards-container">
        <div class="card">
            <h3>Usuários</h3>
            <div class="numero" id="total-usuarios">0</div>
            <button onclick="abrirModal('usuários')">Gerenciar</button>
        </div>
        <div class="card">
            <h3>Quizzes</h3>
            <div class="numero" id="total-quizzes">0</div>
            <button onclick="abrirModal('quizzes')">Gerenciar</button>
        </div>
        <div class="card">
            <h3>Avaliações</h3>
            <div class="numero" id="total-avaliacoes">0</div>
            <button onclick="abrirModal('avaliacoes')">Visualizar</button>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-box"><canvas id="chartEscolaridade"></canvas></div>
        <div class="chart-box"><canvas id="chartCadastros"></canvas></div>
    </div>
</div>

<div id="modal">
    <div class="modal-content">
        <h2 id="modal-titulo"></h2>
        
        <div id="status-feedback" class="status-msg"></div>

        <div id="modal-corpo"></div>
        <br>
        <button onclick="fecharModal()" style="padding: 10px 20px; cursor: pointer;">Fechar Janela</button>
    </div>
</div>

<script>
    let detalhesModais = {};
    let chart1 = null;
    let chart2 = null;

    async function carregarDados() {
        try {
            const res = await fetch('../config/admin_data.php');
            const dados = await res.json();
            detalhesModais = dados.detalhes;

            document.getElementById('total-usuarios').innerText = dados.cards.usuarios || 0;
            document.getElementById('total-quizzes').innerText = dados.cards.quizzes || 0;
            document.getElementById('total-avaliacoes').innerText = dados.cards.avaliacoes || 0;

            if (chart1) chart1.destroy();
            if (chart2) chart2.destroy();

            const ctx1 = document.getElementById('chartEscolaridade').getContext('2d');
            chart1 = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: dados.graficoEscolaridade.labels || [],
                    datasets: [{ label: 'Alunos por Escolaridade', data: dados.graficoEscolaridade.valores || [], backgroundColor: '#1595c4' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx2 = document.getElementById('chartCadastros').getContext('2d');
            chart2 = new Chart(ctx2, {
                type: 'pie',
                data: {
                    labels: ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'],
                    datasets: [{ data: dados.graficoSemana || [0,0,0,0,0,0,0], backgroundColor: ['#ff6384', '#36a2eb', '#cc65fe', '#ffce56', '#2ecc71', '#e67e22', '#95a5a6'] }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        } catch (error) { console.error("Erro:", error); }
    }

    function mostrarFeedback(msg, tipo) {
        const div = document.getElementById('status-feedback');
        div.innerText = msg;
        div.className = `status-msg status-${tipo}`;
        div.style.display = 'block';
        
        // Esconde após 3 segundos
        setTimeout(() => { div.style.display = 'none'; }, 3000);
    }

    function abrirModal(tipo) {
        const titulo = document.getElementById('modal-titulo');
        const corpo = document.getElementById('modal-corpo');
        titulo.innerText = "Gerenciar " + tipo.charAt(0).toUpperCase() + tipo.slice(1);
        
        const dados = detalhesModais[tipo] || [];
        let html = "";

        if (tipo === 'usuários') {
            html = `<table class="admin-table">
                <thead><tr><th>ID</th><th>Nome</th><th>Email</th><th>Ações</th></tr></thead>
                <tbody>`;
            dados.forEach(u => {
                html += `<tr id="row-user-${u.id}">
                    <td>${u.id}</td><td>${u.nome}</td><td>${u.email}</td>
                    <td><button class="btn-excluir" onclick="confirmarExclusao('usuario', ${u.id})">Excluir</button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
        } 
        else if (tipo === 'quizzes') {
            html = `<table class="admin-table">
                <thead><tr><th>Quiz</th><th>Matéria</th><th>Ações</th></tr></thead>
                <tbody>`;
            dados.forEach(q => {
                html += `<tr id="row-quiz-${q.id}">
                    <td>${q.nome_quiz}</td><td>${q.nome_materia}</td>
                    <td>
                        <button class="btn-editar" onclick="mostrarFeedback('Função em desenvolvimento', 'success')">Editar</button>
                        <button class="btn-excluir" onclick="confirmarExclusao('quiz', ${q.id})">Excluir</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
        }

        corpo.innerHTML = html || "<p>Nenhum registro.</p>";
        document.getElementById('modal').style.display = 'flex';
    }

    // INTERAÇÃO NA INTERFACE: Substitui o window.confirm
    function confirmarExclusao(tipo, id) {
        const div = document.getElementById('status-feedback');
        div.innerHTML = `Tem certeza? 
            <button onclick="executarExclusao('${tipo}', ${id})" style="background:red; color:white; border:none; padding:3px 10px; cursor:pointer; margin-left:10px;">Sim, excluir</button> 
            <button onclick="document.getElementById('status-feedback').style.display='none'" style="background:#666; color:white; border:none; padding:3px 10px; cursor:pointer;">Cancelar</button>`;
        div.className = "status-msg status-error";
        div.style.display = "block";
    }

    async function executarExclusao(tipo, id) {
        try {
            const response = await fetch(`../config/excluir_adm.php?tipo=${tipo}&id=${id}`);
            const resultado = await response.json();

            if (resultado.status) {
                mostrarFeedback(`${tipo.charAt(0).toUpperCase() + tipo.slice(1)} removido com sucesso!`, "success");
                
                // Remove a linha da tabela visualmente sem fechar o modal
                const row = document.getElementById(`row-${tipo === 'usuario' ? 'user' : 'quiz'}-${id}`);
                if(row) row.style.display = 'none';

                carregarDados(); // Atualiza cards e gráficos ao fundo
            } else {
                mostrarFeedback("Erro: " + resultado.erro, "error");
            }
        } catch (error) {
            mostrarFeedback("Erro de conexão com o servidor.", "error");
        }
    }

    function fecharModal() { 
        document.getElementById('modal').style.display = 'none'; 
        document.getElementById('status-feedback').style.display = 'none';
    }
    
    carregarDados();
</script>

</body>
</html>
