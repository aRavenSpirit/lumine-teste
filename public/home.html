<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="./style/home.css">
</head>

<body>

<header>
    <nav>
        <a href="#">Sobre nós</a>
        <a href="#">Novidades</a>
        <a href="#">Todos os quizzes</a>
        <a href="#">Perfil</a>
    </nav>
</header>

<div class="sidebar">
    <a href="index.html"><img src="img/LUMINE.png" width="100px"></a>
    <nav id="menuMaterias"></nav>
</div>

<main>

    <section>
        <h2 id="bemvindo"></h2>
        <a href="../config/logout.php">Sair</a>
    </section>

    <section>
        <div class="group-cards" id="cardsMaterias"></div>
    </section>

</main>

<!-- MODAL -->
<div id="meuModal" class="modal">
    <div class="modal-content">
        <span onclick="fecharModal()" class="modal-close">&times;</span>
        <h2>Conteúdos</h2>
        <div id="corpoModal"></div>
    </div>
</div>

<script>

const api = "../config/home.php";

window.onload = () => {
    carregarUsuario();
    carregarMaterias();
};

// =========================
// USUÁRIO
// =========================
function carregarUsuario() {
    fetch(api + "?tipo=usuario")
        .then(r => r.json())
        .then(u => {
            document.getElementById("bemvindo").innerText =
                "Bem vindo " + u.nome + " 👋";
        });
}

// =========================
// MATÉRIAS
// =========================
function carregarMaterias() {
    fetch(api + "?tipo=materias")
        .then(r => r.json())
        .then(dados => {

            let menu = "";
            let cards = "";

            dados.forEach(m => {

                menu += `<a href="#">${m.nome_materia}</a>`;

                cards += `
                    <div onclick="openModal(${m.id})" class="card">
                        <p>${m.nome_materia}</p>
                    </div>
                `;
            });

            document.getElementById("menuMaterias").innerHTML = menu;
            document.getElementById("cardsMaterias").innerHTML = cards;
        });
}

// =========================
// MODAL
// =========================
function openModal(idMateria) {

    const modal = document.getElementById('meuModal');
    const corpo = document.getElementById('corpoModal');

    modal.style.display = "block";
    corpo.innerHTML = "Carregando conteúdos...";

    fetch(api + "?tipo=conteudos&id_materia=" + idMateria)
        .then(res => res.json())
        .then(dados => {

            let html = "";

            dados.forEach(c => {
                html += `
                    <div class="conteudo-item"  onclick="toggleQuizzes(${c.id}, this)">
                        <div class="conteudo-titulo">
                            ${c.nome}
                        </div>
                        <div id="quiz_${c.id}" class="quiz-container"></div>
                    </div>
                `;
            });

            corpo.innerHTML = html;
        });
}

// =========================
// DROPDOWN QUIZZES
// =========================
function toggleQuizzes(idConteudo, el) {

    let existente = el.nextElementSibling;

    // se já estiver aberto → fecha
    if (existente && existente.classList.contains("quizzes-box")) {
        existente.remove();
        return;
    }

    fetch(api + `?tipo=quizzes&id_conteudo=${idConteudo}`)
        .then(res => res.json())
        .then(quizzes => {

            let box = document.createElement("div");
            box.className = "quizzes-box";

            if (quizzes.length === 0) {
                box.innerHTML = "<p>Sem quizzes disponíveis</p>";
            } else {

                quizzes.forEach(q => {

                    box.innerHTML += `
                        <a href="quiz.html?id=${q.id}" class="quiz-card-link">
                            <div class="quiz-card">
                                <h4>${q.nome}</h4>
                                <p><strong>Dificuldade:</strong> ${q.dificuldade}</p>
                                <p><strong>Conteúdo:</strong> ${q.conteudo}</p>
                            </div>
                        </a>
                    `;
                });

            }

            el.after(box);
        });
}
function fecharModal() {
    document.getElementById('meuModal').style.display = "none";
}

</script>

</body>
</html>
