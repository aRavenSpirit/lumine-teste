<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(to left, rgb(227, 240, 254, 0.65), rgb(227, 240, 254, 0.65));
        }
        .container {
            background-color: #fff;
            width: 100%;
            max-width: 450px;
            border-radius: 20px;
            border: 4px solid #1595c4;
            padding: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-bottom: 20px; text-align: center; }
        .input-box {
            display: flex;
            align-items: center;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            padding-left: 10px;
            height: 40px;
            margin-bottom: 15px;
        }
        .input-box input {
            border: none;
            outline: none;
            width: 100%;
            padding: 10px;
        }
        .btn {
            background-color: #a3e1ff;
            border: 2px solid #1595c4;
            padding: 12px;
            width: 100%;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background-color: #8bd8ff; }
        #mensagem { text-align: center; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nova Senha</h2>
        <form id="formNovaSenha" onsubmit="atualizarSenha(event)">
            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required>
            </div>
            <p id="mensagem"></p>
            <button class="btn" type="submit">Salvar Nova Senha</button>
        </form>
    </div>

    <script>
    // Obtém o token enviado via URL na Query String (?token=...)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    function atualizarSenha(e) {
        e.preventDefault();
        const msg = document.getElementById('mensagem');
        const senha = document.getElementById('novaSenha').value;

        if (!token) {
            msg.style.color = "#ff3636";
            msg.innerHTML = "Token inválido ou ausente.";
            return;
        }

        msg.style.color = "#1595c4";
        msg.innerHTML = "Atualizando...";

        fetch("/lumine-teste/config/processar_reset.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, senha: senha })
        })
        .then(r => r.json())
        .then(d => {
            if (d.status) {
                msg.style.color = "#28a745";
                msg.innerHTML = d.msg;
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2500);
            } else {
                msg.style.color = "#ff3636";
                msg.innerHTML = d.msg;
            }
        })
        .catch(err => {
            msg.style.color = "#ff3636";
            msg.innerHTML = "Erro de conexão com o servidor.";
        });
    }
    </script>
</body>
</html>
