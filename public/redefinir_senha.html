<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style/cadastro.css">
    <link rel="stylesheet" href="../public/style/esqueceu_senha.css">
    <link rel="stylesheet" href="../public/style/cadastro.css">
    <!-- redefinir_senha.css por ÚLTIMO para sobrepor regras -->
    <link rel="stylesheet" href="../public/style/redefinir_senha.css">
</head>
<body class="body-redefinir">
    <div class="container">
        <h2 class="titulo-senha">Nova Senha</h2>
        <form class="formNovaSenha" id="formNovaSenha" onsubmit="atualizarSenha(event)">
            
            <!-- Campo de senha idêntico ao do cadastro.html -->
            <div class="container-senha">
                <input type="password" id="novaSenha" placeholder="Digite sua nova senha" required>
                <i onclick="toggleSenha()" class="fas fa-eye olho-senha"></i>
                
                <!-- Balão de aviso de requisitos -->
                <div id="balao-aviso" class="balao-aviso"></div>
            </div>

            <!-- Barra de segurança -->
            <div class="barra-seguranca-redefinir-senha">
                <div id="seg-length" class="segmento" data-label="Comprimento"></div>
                <div id="seg-uppercase" class="segmento" data-label="Maiúscula"></div>
                <div id="seg-number" class="segmento" data-label="Número"></div>
                <div id="seg-special" class="segmento" data-label="Especial"></div>
            </div>

            <div id="mensagem"></div>
            <button class="btn" type="submit">Salvar Nova Senha</button>
        </form>
    </div>

    <script src="js/validar-senha.js"></script>

    <script>
    inicializarValidacaoSenha({ senhaInputId: "novaSenha" });

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // Limpa a caixa de erro ao digitar (igual ao cadastro)
    const campos = document.querySelectorAll('input');
    campos.forEach(campo => {
        campo.addEventListener('input', () => {
            const msg = document.getElementById("mensagem");
            msg.className = ""; 
            setTimeout(() => {
                if(!msg.classList.contains('caixa-erro')) {
                    msg.innerHTML = "";
                    msg.style.color = "";
                    msg.style.borderColor = "";
                }
            }, 400);
        });
    });

    // Função de exibição de erro idêntica ao cadastro
    function exibirErro(texto) {
        const msg = document.getElementById("mensagem");
        msg.style.color = "";
        msg.style.borderColor = "";
        msg.innerHTML = texto;
        msg.className = "caixa-erro";
    }

    function toggleSenha() {
        const input = document.getElementById("novaSenha");
        const icone = document.querySelector(".olho-senha");
        if (input.type === "password") {
            input.type = "text";
            icone.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icone.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function atualizarSenha(e) {
        e.preventDefault();
        const msg = document.getElementById('mensagem');
        const senha = document.getElementById('novaSenha').value;

        if (!token) {
            exibirErro("Token inválido ou ausente.");
            return;
        }

        if (!senhaValida) {
            exibirErro("A sua senha não cumpre todos os requisitos de segurança exigidos.");
            return;
        }

        msg.className = "";
        msg.style.color = "#1595c4";
        msg.innerHTML = "Atualizando...";

        fetch("/lumine-teste/config/processar_reset.php", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, senha: senha })
        })
        .then(r => r.json())
        .then(d => {
            if (d.status) {
                msg.innerHTML = d.msg;
                msg.className = "caixa-erro"; 
                msg.style.color = "#28a745";
                msg.style.borderColor = "#28a745";
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2500);
            } else {
                exibirErro(d.msg || "Erro ao redefinir a senha.");
            }
        })
        .catch(err => {
            exibirErro("Erro de conexão com o servidor.");
        });
    }
    </script>
</body>
</html>
