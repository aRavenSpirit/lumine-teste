<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumine</title>
    <link rel="stylesheet" href="./style/index.css">
    
</head>
<body>

    <nav class="navbar">
        <div class="logo-section">
            <img src="./img/LUMINE.png" alt="Lumine" class="logo-img">
        </div>
        
        <ul class="nav-links">
            <li class="item-sobre"><a href="#">Sobre nós</a></li>
            <li class="item-novidades"><a href="#">Novidades</a></li>
            <li class="item-quizzes"><a href="#">Todos os quizzes</a></li>
            <li class="item-acessar">
                <a href="login.html" class="btn-acessar">Acessar</a>
            </li>
        </ul>

        <div class="hamburger" onclick="toggleMenu()">☰</div>
    </nav>

    <div class="mobile-menu" id="mobileMenu">
        <div class="item-sobre-mob"><a href="#">Sobre nós</a></div>
        <div class="item-novidades-mob"><a href="#">Novidades</a></div>
        <div class="item-quizzes-mob"><a href="#">Todos os quizzes</a></div>
        <div class="item-acessar-mob"><a href="login.html">Acessar</a></div>
    </div>

    <main class="hero">
        <div class="hero-content">
            <h1 class="letras-lumine">
                <span class="L">L</span><span class="U">U</span><span class="M">M</span><span class="I">I</span><span class="N">N</span><span class="E">E</span>
            </h1>
            <p class="subtitle">NA LUMINE, VOCÊ DESAFIA A SUA MENTE.</p>
            <p class="subtitle">CONHEÇA AGORA, O <span class="melhor-subtitulo">MELHOR</span> SITE DE QUIZZES!</p>
        </div>
    </main>

    <script>
        function toggleMenu() {
            const menu = document.getElementById("mobileMenu");
            menu.classList.toggle("active");
        }
        // Adiciona um "ouvinte" para o evento de redimensionar a tela
        window.addEventListener('resize', function() {
        // Recarrega a página atual
        window.location.reload();
    });
    </script>
</body>
</html>
