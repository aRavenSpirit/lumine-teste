<body>
    <!-- Barra de navegação -->

    <div class="menu-logo"><h2>Img</h2></div>
    <div class="hamburger" onclick="toggleMenu()">☰</div>
    
    <ul>

</nav>

    <script>
        // Função para alternar a visibilidade do menu móvel
        function toggleMenu() {
            var menu = document.getElementById("mobileMenu"); // Obtém o elemento do menu móvel
            if (menu.style.display === "flex") { // Verifica se o menu está visível
                menu.style.display = "none"; // Oculta o menu
            } else {
                menu.style.display = "flex"; // Exibe o menu como um flex container
            }
        }
    </script>
</body>
