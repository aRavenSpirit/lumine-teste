<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - LUMINE</title>
    <link rel="stylesheet" href="./style/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="image/x-icon">
    <script src="js/navegacao-teclado.js" defer></script>
</head>
<body>
    <div class="container-cadastro">
        <div class="area-icone">
            <a href="index.php"><img src="./img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-cad">Cadastre-se</h1>

        <div class="conteudo-form">
            <div class="blocos-cad">
                
                <input type="hidden" id="id">
                <input type="text" id="nome" placeholder="Insira seu nome de usuário" minlength="3" maxlength="45" required>
                
                <input type="email" id="email" placeholder="Insira seu email" required>

                <div class="container-senha" style="position: relative; width: 100%;">
                    <input type="password" id="senha" placeholder="Crie uma senha" required>
                    <i onclick="toggleSenha()" class="fas fa-eye olho-senha"></i>
                    
                    <div id="balao-aviso" class="balao-aviso"></div>
                </div>
                
                <div class="container-senha" style="position: relative; width: 100%;">
                    <input type="password" id="confirmar" placeholder="Confirme a senha" required>
                    <i onclick="toggleConfirmarSenha()" class="fas fa-eye olho-senha-confirmar"></i>
                </div>

                <div class="barra-seguranca">
                    <div id="seg-length" class="segmento" data-label="Comprimento"></div>
                    <div id="seg-uppercase" class="segmento" data-label="Maiúscula"></div>
                    <div id="seg-number" class="segmento" data-label="Número"></div>
                    <div id="seg-special" class="segmento" data-label="Especial"></div>
                </div>

                <div id="mensagem"></div>
            </div>

            <p class="texto-cadastro">Já tem conta? <a href="login.html">Login</a></p>

            <div class="area-botao">
                <button onclick="cadastrar()" class="botao-cadastrar">Cadastrar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Seleção de Escolaridade (Estética idêntica ao Login/Cadastro) -->
    <div id="modal-escolaridade" class="modal-overlay">
        <div class="modal-box">
            <div class="area-icone-modal">
                <img src="./img/LUMINE.png" alt="Logo" class="icone-site-modal">
            </div>

            <h2 class="titulo-modal">Quase lá!</h2>
            <p class="subtitulo-modal">Selecione a sua escolaridade para personalizarmos os seus conteúdos:</p>
            
            <div class="select-wrapper">
                <select id="select-escolaridade">
                    <option value="">A carregar opções...</option>
                </select>
            </div>

            <div id="msg-modal"></div>

            <div class="area-botao-modal">
                <button onclick="salvarEscolaridade()" class="botao-cadastrar">Continuar</button>
            </div>
        </div>
    </div>

    <script src="js/tamanho_fonte.js"></script>
    <script src="js/validar-senha.js"></script>

    <script>
        inicializarValidacaoSenha();

        let emailCadastrado = "";

        const campos = document.querySelectorAll('input');
        campos.forEach(campo => {
            campo.addEventListener('input', () => {
                const msg = document.getElementById("mensagem");
                msg.className = ""; 
                setTimeout(() => {
                    if(!msg.classList.contains('caixa-erro') && !msg.classList.contains('caixa-sucesso')) {
                        msg.innerHTML = "";
                    }
                }, 400);
            });
        });

        // Limpa a mensagem de erro do modal ao selecionar uma opção
        document.getElementById("select-escolaridade").addEventListener('change', () => {
            const msgModal = document.getElementById("msg-modal");
            msgModal.className = "";
            setTimeout(() => {
                if(!msgModal.classList.contains('caixa-erro-modal')) {
                    msgModal.innerText = "";
                }
            }, 400);
        });

        function exibirErro(texto) {
            const msg = document.getElementById("mensagem");
            msg.innerHTML = texto;
            msg.className = "caixa-erro";
        }

        function exibirSucesso(texto) {
            const msg = document.getElementById("mensagem");
            msg.innerHTML = texto;
            msg.className = "caixa-sucesso";
        }

        function exibirErroModal(texto) {
            const msg = document.getElementById("msg-modal");
            msg.innerText = texto;
            msg.className = texto ? "caixa-erro-modal" : "";
        }

        function mostrarModalEscolaridade() {
            const modal = document.getElementById("modal-escolaridade");
            modal.classList.add("ativo");
            exibirErroModal("");
            
            fetch("../config/api.php?tipo=escolaridade", {
                credentials: "same-origin"
            })
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("select-escolaridade");
                    select.innerHTML = '<option value="">Selecione a sua escolaridade</option>';
                    dados.forEach(e => {
                        select.innerHTML += `<option value="${e.id_escolaridade}">${e.nome_escolaridade}</option>`;
                    });
                })
                .catch(err => {
                    exibirErroModal("Erro ao carregar escolaridades.");
                });
        }

        function salvarEscolaridade() {
            const esc = document.getElementById("select-escolaridade").value;
            if(!esc) {
                exibirErroModal("Por favor, escolha uma opção!");
                return;
            }
            
            fetch("../config/salvar_escolaridade.php", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    escolaridade_id: esc,
                    email: emailCadastrado
                })
            })
            .then(r => r.json())
            .then(d => {
                if(d.status) {
                    window.location = "home.php";
                } else {
                    exibirErroModal(d.erro || "Erro ao salvar.");
                }
            })
            .catch(() => {
                exibirErroModal("Erro ao conectar com o servidor.");
            });
        }

        function cadastrar(){
            let nome = document.getElementById("nome").value.trim();
            let email = document.getElementById("email").value.trim();
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;

            if(!nome || !email || !senha || !confirmar){
                exibirErro("Preencha todos os campos!");
                return;
            }
            const limiteMin = 3;
            const limiteMax = 45;

            if (nome.length < limiteMin) {
                exibirErro(`O nome deve ter pelo menos ${limiteMin} caracteres.`);
                return;
            }

            if (nome.length > limiteMax) {
                exibirErro(`O nome deve ter no máximo ${limiteMax} caracteres.`);
                return;
            }

            const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!regexEmail.test(email)) {
                exibirErro("Por favor, insira um e-mail válido (ex: usuario@email.com)");
                return;
            }
            
            if (!senhaValida) {
                exibirErro("A sua senha não cumpre todos os requisitos de segurança exigidos.");
                return;
            }

            if(senha !== confirmar){
                exibirErro("As senhas não coincidem!");
                return;
            }

            fetch("../config/cadastrar.php",{
                method:"POST",
                credentials: "same-origin",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha
                })
            })
            .then(r=>r.json())
            .then(d=>{
                if(d.erro){
                    exibirErro(d.erro);
                    document.getElementById("senha").value = "";
                    document.getElementById("confirmar").value = "";
                    senhaInput.dispatchEvent(new Event('input'));
                    return;
                }

                emailCadastrado = email;

                // Autentica automaticamente para iniciar a $_SESSION no servidor antes de abrir o modal
                fetch("../config/login.php", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: email,
                        senha: senha
                    })
                })
                .catch(() => {})
                .finally(() => {
                    exibirSucesso("Conta criada com sucesso!");
                    
                    setTimeout(() => {
                        mostrarModalEscolaridade();
                    }, 1000);
                });
            })
            .catch(err => {
                exibirErro("Este e-mail já está cadastrado.");
            });
        }

        function toggleSenha() {
            const input = document.getElementById("senha");
            const icone = document.querySelector(".olho-senha");
            if (input.type === "password") {
                input.type = "text";
                icone.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icone.classList.replace("fa-eye-slash", "fa-eye");
            }
        }

        function toggleConfirmarSenha() {
            const input = document.getElementById("confirmar");
            const icone = document.querySelector(".olho-senha-confirmar");
            if (input.type === "password") {
                input.type = "text";
                icone.classList.replace("fa-eye", "fa-eye-slash");
            } else {
                input.type = "password";
                icone.classList.replace("fa-eye-slash", "fa-eye");
            }
        }
    </script>
</body>
</html>
