<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - LUMINE</title>
    <link rel="stylesheet" href="./style/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="image/x-icon">
    <script src="js/navegacao-teclado.js" defer></script>
</head>
<body>
    <div class="container-cadastro">
        <div class="area-icone">
            <a href="index.php"><img src="./img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-cad">Cadastre-se</h1>

        <div class="conteudo-form">
            <div class="blocos-cad">
                <input type="hidden" id="id">
                
                <input type="text" id="nome" placeholder="Insira seu nome de usuário" required>

                <input type="email" id="email" placeholder="Insira seu email" required>

                <div class="container-senha" style="position: relative; width: 100%;">
                    <input type="password" id="senha" placeholder="Crie uma senha" required>
                    <i onclick="toggleSenha()" class="fas fa-eye olho-senha"></i>
                    
                    <div id="balao-aviso" class="balao-aviso"></div>
                </div>
                
                <div class="container-senha" style="position: relative; width: 100%;">
                    <input type="password" id="confirmar" placeholder="Confirme a senha" required>
                    <i onclick="toggleConfirmarSenha()" class="fas fa-eye olho-senha-confirmar"></i>
                </div>

                <div class="barra-seguranca">
                    <div id="seg-length" class="segmento" data-label="Comprimento"></div>
                    <div id="seg-uppercase" class="segmento" data-label="Maiúscula"></div>
                    <div id="seg-number" class="segmento" data-label="Número"></div>
                    <div id="seg-special" class="segmento" data-label="Especial"></div>
                </div>

                <div id="mensagem"></div>
            </div>

            <p class="texto-cadastro">Já tem conta? <a href="login.html">Login</a></p>

            <div class="area-botao">
                <button onclick="cadastrar()" class="botao-cadastrar">Cadastrar</button>
            </div>
        </div>
    </div>

    <script src="js/tamanho_fonte.js"></script>

    <script>
    let senhaValida = false;

    const senhaInput = document.getElementById("senha");
    const balaoAviso = document.getElementById("balao-aviso");

    const segLength = document.getElementById("seg-length");
    const segUppercase = document.getElementById("seg-uppercase");
    const segNumber = document.getElementById("seg-number");
    const segSpecial = document.getElementById("seg-special");

    senhaInput.addEventListener("input", () => {
        const valor = senhaInput.value;

        const temTamanho = valor.length >= 8;
        segLength.className = "segmento " + (temTamanho ? "valido" : valor.length > 0 ? "invalido" : "");

        const temMaiuscula = /[A-Z]/.test(valor);
        segUppercase.className = "segmento " + (temMaiuscula ? "valido" : valor.length > 0 ? "invalido" : "");

        const temNumero = /[0-9]/.test(valor);
        segNumber.className = "segmento " + (temNumero ? "valido" : valor.length > 0 ? "invalido" : "");

        const temEspecial = /[^A-Za-z0-9]/.test(valor);
        segSpecial.className = "segmento " + (temEspecial ? "valido" : valor.length > 0 ? "invalido" : "");

        senhaValida = temTamanho && temMaiuscula && temNumero && temEspecial;

        if (valor.length === 0) {
            balaoAviso.style.display = "none";
        } else if (!temTamanho) {
            balaoAviso.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falta: No mínimo 8 caracteres`;
            balaoAviso.style.display = "block";
        } else if (!temMaiuscula) {
            balaoAviso.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falta: Pelo menos uma letra maiúscula`;
            balaoAviso.style.display = "block";
        } else if (!temNumero) {
            balaoAviso.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falta: Pelo menos um número`;
            balaoAviso.style.display = "block";
        } else if (!temEspecial) {
            balaoAviso.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> Falta: Um caractere especial (!@#$)`;
            balaoAviso.style.display = "block";
        } else {
            balaoAviso.style.display = "none";
        }
    });

    const campos = document.querySelectorAll('input');
    campos.forEach(campo => {
        campo.addEventListener('input', () => {
            const msg = document.getElementById("mensagem");
            msg.className = ""; 
            setTimeout(() => {
                if(!msg.classList.contains('caixa-erro')) {
                    msg.innerHTML = "";
                }
            }, 400);
        });
    });

    function exibirErro(texto) {
        const msg = document.getElementById("mensagem");
        msg.innerHTML = texto;
        msg.className = "caixa-erro";
    }

    function cadastrar(){
        let nome = document.getElementById("nome").value.trim();
        let email = document.getElementById("email").value.trim();
        let senha = document.getElementById("senha").value;
        let confirmar = document.getElementById("confirmar").value;

        if(!nome || !email || !senha || !confirmar){
            exibirErro("Preencha todos os campos!");
            return;
        }

        const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!regexEmail.test(email)) {
            exibirErro("Por favor, insira um e-mail válido (ex: usuario@email.com)");
            return;
        }

        if (!senhaValida) {
            exibirErro("A sua senha não cumpre todos os requisitos de segurança exigidos.");
            return;
        }

        if(senha !== confirmar){
            exibirErro("As senhas não coincidem!");
            return;
        }

        fetch("../config/cadastrar.php",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                nome: nome,
                email: email,
                senha: senha
            })
        })
        .then(r=>r.json())
        .then(d=>{
            if(d.erro){
                exibirErro(d.erro);
                document.getElementById("senha").value = "";
                document.getElementById("confirmar").value = "";
                senhaInput.dispatchEvent(new Event('input'));
                return;
            }

            const msg = document.getElementById("mensagem");
            msg.innerHTML = "Conta criada com sucesso!";
            msg.className = "caixa-erro"; 
            msg.style.color = "green";
            msg.style.borderColor = "green";
            
            setTimeout(() => {
                window.location="login.html";
            }, 2000);
        })
        .catch(err => {
            exibirErro("Erro ao conectar com o servidor.");
        });
    }

    function toggleSenha() {
        const input = document.getElementById("senha");
        const icone = document.querySelector(".olho-senha");
        if (input.type === "password") {
            input.type = "text";
            icone.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icone.classList.replace("fa-eye-slash", "fa-eye");
        }
    }

    function toggleConfirmarSenha() {
        const input = document.getElementById("confirmar");
        const icone = document.querySelector(".olho-senha-confirmar");
        if (input.type === "password") {
            input.type = "text";
            icone.classList.replace("fa-eye", "fa-eye-slash");
        } else {
            input.type = "password";
            icone.classList.replace("fa-eye-slash", "fa-eye");
        }
    }
</script>
</body>
</html>
