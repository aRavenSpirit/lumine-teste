<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="img/LUMINE-5con.ico">

    <style>
        .erro {
            color: #ff3636;
            font-size: 0.85rem;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <div class="container-cadastro">

        <div class="area-icone">
            <a href="index.html"><img src="./img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-cad">Cadastre-se</h1>

        <div class="conteudo-form">
            <div class="blocos-cad">
                <input type="hidden" id="id">
                
                <input type="text" name="nome_usuario" placeholder="Crie um nome de usuário" id="nome" required>
                <small id="erro_nome" class="erro"></small>

                <input type="email" name="email" placeholder="Digite seu email" id="email" required>
                <small id="erro_email" class="erro"></small>

                <select id="escolaridade">
                    <option value="">Escolaridade</option>
                </select>
                <small id="erro_escolaridade" class="erro"></small>

                <div class="container-senha">
                    <input type="password" name="senha" placeholder="Digite sua senha" id="senha" onfocus="MostrarMensagem()" onblur="EsconderMensagem()" required>
                    <i onclick="toggleSenha()" class="fas fa-eye olho-senha"></i>
                </div>

                <p id="mensagem"></p>
                <small id="erro_senha" class="erro"></small>
                
                <input type="password" name="confirmar_senha" placeholder="Digite novamente a senha" id="confirmar" required>
                <small id="erro_confirmar" class="erro"></small>
            </div>

            <p class="texto-cadastro">Já tem conta? <a href="login.html">Login</a></p>
            <a href="admin.php">Admin teste</a>

            <div class="area-botao">
                <button onclick="cadastrar()" class="botao-cadastrar">Cadastrar</button>
            </div>
        </div>
    </div>

    <script>
        function MostrarMensagem(){
            let elementoMensagem = document.getElementById("mensagem");
            elementoMensagem.innerHTML = "A senha deve ter pelo menos 6 caracteres.";
        }

        function EsconderMensagem(){
            let elementoMensagem = document.getElementById("mensagem");
            elementoMensagem.innerHTML = "";
        }

        const api = "../config/api.php";

        window.onload = function () {
            carregarEscolaridades();
        }

        function carregarEscolaridades() {
            fetch(api + "?tipo=escolaridade")
                .then(r => r.json())
                .then(dados => {

                    let select = document.getElementById("escolaridade");

                    dados.forEach(e => {
                        select.innerHTML += `
                            <option value="${e.id_escolaridade}">
                                ${e.nome_escolaridade}
                            </option>
                        `;
                    });
                });
        }

        function limparErros(){
            document.querySelectorAll(".erro").forEach(e => e.innerText = "");
        }

        function cadastrar(){

            limparErros();

            let nome = document.getElementById("nome").value.trim();
            let email = document.getElementById("email").value.trim();
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;
            let escolaridade = document.getElementById("escolaridade").value;

            let erro = false;

            if(!nome){
                document.getElementById("erro_nome").innerText = "Nome é obrigatório";
                erro = true;
            }

            if(!email){
                document.getElementById("erro_email").innerText = "Email é obrigatório";
                erro = true;
            }

            if(!escolaridade){
                document.getElementById("erro_escolaridade").innerText = "Selecione a escolaridade";
                erro = true;
            }

            if(senha.length < 6){
                document.getElementById("erro_senha").innerText = "Mínimo 6 caracteres";
                erro = true;
            }

            if(senha !== confirmar){
                document.getElementById("erro_confirmar").innerText = "Senhas diferentes";
                erro = true;
            }

            if(erro) return;

            fetch("../config/cadastrar.php",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    nome: nome,
                    email: email,
                    senha: senha,
                    escolaridade_id: escolaridade
                })
            })
            .then(r=>r.json())
            .then(d=>{
                
                if(d.erro){
                    document.getElementById("erro_email").innerText = d.erro;
                    return;
                }

                document.getElementById("mensagem").innerText = "Conta criada com sucesso!";
                document.getElementById("mensagem").style.color = "green";
                
                setTimeout(() => {
                    window.location="login.html";
                }, 2000);
            })
            .catch(err => {
                console.error("Erro na requisição:", err);
                document.getElementById("mensagem").innerText = "Erro ao conectar com o servidor.";
                document.getElementById("mensagem").style.color = "red";
            });
        }

        function toggleSenha() {
            const input = document.getElementById("senha");

            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

    </script>
</body>

</html>
