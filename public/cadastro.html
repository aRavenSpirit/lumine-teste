<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>

<body>

    <h2>Criar Conta</h2>

    <input type="hidden" id="id">
    
    Nome:
    <input type="text" id="nome"><br><br>

    Email:
    <input type="email" id="email"><br><br>

    Senha:
    <input type="password" id="senha"><br><br>

    Confirmar senha:
    <input type="password" id="confirmar"><br><br>

    Escolaridade:
    <select id="escolaridade">
        <option value="">Selecione...</option>
    </select>
    <br><br>

    <button onclick="cadastrar()">Cadastrar</button>

    <p>Já tem conta? <a href="login.html">Login</a></p>
    <a href="admin.php">Admin teste</a>

    <script>
        const api = "../config/api.php";

        window.onload = function () {
            carregarEscolaridades();
        }

        function carregarEscolaridades() {
        fetch(api + "?tipo=escolaridade")
            .then(r => r.json())
            .then(dados => {

                let select = document.getElementById("escolaridade");

                dados.forEach(e => {

                    select.innerHTML += `
                        <option value="${e.id_escolaridade}">
                            ${e.nome_escolaridade}
                        </option>
                    `;

                });

            });

    }
        function cadastrar(){
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;

            if(senha !== confirmar){
                alert("Senhas diferentes");
                return;
            }

            fetch("../config/cadastrar.php",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    nome:document.getElementById("nome").value,
                    email:document.getElementById("email").value,
                    senha:senha,
                    escolaridade_id:document.getElementById("escolaridade").value
                })
            })
            .then(r=>r.json())
            .then(d=>{
                alert(d.mensagem);
                window.location="login.html";
            });

        }

    </script>
</body>

</html>
