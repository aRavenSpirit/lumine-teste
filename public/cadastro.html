<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="img/LUMINE-5con.ico">
</head>

<body>
    <div class="container-cadastro">

        <div class="area-icone">
            <a href="index.html"><img src="./img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-cad">Cadastre-se</h1>

        <div class="conteudo-form">
            <div class="blocos-cad">
                <input type="hidden" id="id">
                
                <input type="text" name="nome_usuario" placeholder="Crie um nome de usuário" id="nome" required>

                <input type="email" name="email" placeholder="Digite seu email" id="email" required>
                <select id="escolaridade">
                    <option value="">Escolaridade</option>
                </select>
                <div class="container-senha">
                    
                    <input type="password" name="senha" placeholder="Digite sua senha" id="senha" onfocus="MostrarMensagem()" onblur="EsconderMensagem()" required>
                    <i onclick="toggleSenha()"  class="fas fa-eye olho-senha"></i>
                </div>
                <p id="mensagem"></p>
                
                <input type="password" name="confirmar_senha" placeholder="Digite novamente a senha" id="confirmar" required>
            </div>

            <p class="texto-cadastro">Já tem conta? <a href="login.html">Login</a></p>
            <a href="admin.php">Admin teste</a>


            <div class="area-botao">
            <button onclick="cadastrar()" class="botao-cadastrar" >Cadastrar</button>
            </div>
        </div>
    </div>

    <script>
        function MostrarMensagem(){
            let elementoMensagem = document.getElementById("mensagem");
            elementoMensagem.innerHTML = "A senha deve ter pelo menos 6 caracteres.";
        }

        function EsconderMensagem(){
            let elementoMensagem = document.getElementById("mensagem");
            elementoMensagem.innerHTML = "";
        }

        const api = "../config/api.php";

        window.onload = function () {
            carregarEscolaridades();
        }

        function carregarEscolaridades() {
        fetch(api + "?tipo=escolaridade")
            .then(r => r.json())
            .then(dados => {

                let select = document.getElementById("escolaridade");

                dados.forEach(e => {

                    select.innerHTML += `
                        <option value="${e.id_escolaridade}">
                            ${e.nome_escolaridade}
                        </option>
                    `;

                });

            });

    }
        function cadastrar(){
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;
            let elementoMensagem = document.getElementById("mensagem");

            if(senha.length < 6){
                elementoMensagem.innerHTML = "A senha deve ter pelo menos 6 caracteres.";
                elementoMensagem.style.color = "#ff3636";
                return;
            }

            if(senha !== confirmar){
                alert("Senhas diferentes");
                return;
            }

            fetch("../config/cadastrar.php",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    nome:document.getElementById("nome").value,
                    email:document.getElementById("email").value,
                    senha:senha,
                    escolaridade_id:document.getElementById("escolaridade").value
                })
            })
            .then(r=>r.json())
            .then(d=>{
                
                alert("Conta Criada! Redirecionando...");
                
                setTimeout(() => {
                    window.location="login.html";
                }, 2000);
            })
            .catch(err => {
                console.error("Erro na requisição:", err);
                resultadoFinal.innerHTML = "Erro ao conectar com o servidor.";
            });

        }

        function toggleSenha() {
            const input = document.getElementById("senha");

            if (input.type === "password") {
                input.type = "text";
            } else {
                input.type = "password";
            }
        }

    </script>
</body>

</html>
