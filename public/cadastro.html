<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./style/cadastro.css">
</head>

<body>
    <div class="container-cadastro">

        <div class="area-icone">
            <img src="./img/LUMINE.png" alt="Logo" class="icone-site">
        </div>

        <h1 class="titulo-cad">Cadastre-se</h1>

        <div class="conteudo-form">
            <div class="blocos-cad">
                <input type="hidden" id="id">
                
                <input type="text" name="nome_usuario" placeholder="Crie um nome de usuário" id="nome" required>

                <input type="email" name="email" placeholder="Digite seu email" id="email" required>
           
                <input type="password" name="senha" placeholder="Digite sua senha" id="senha" required>
                
                <input type="password" name="confirmar_senha" placeholder="Digite novamente a senha" id="confirmar" required>

                <select id="escolaridade">
                    <option value="">Escolaridade</option>
                </select>
            </div>

            <p class="texto-cadastro">Já tem conta? <a href="login.html">Login</a></p>
            <a href="admin.php">Admin teste</a>


            <div class="area-botao">
            <button onclick="cadastrar()" class="botao-cadastrar" >Cadastrar</button>
            </div>
        </div>
    </div>

    <script>
        const api = "../config/api.php";

        window.onload = function () {
            carregarEscolaridades();
        }

        function carregarEscolaridades() {
        fetch(api + "?tipo=escolaridade")
            .then(r => r.json())
            .then(dados => {

                let select = document.getElementById("escolaridade");

                dados.forEach(e => {

                    select.innerHTML += `
                        <option value="${e.id_escolaridade}">
                            ${e.nome_escolaridade}
                        </option>
                    `;

                });

            });

    }
        function cadastrar(){
            let senha = document.getElementById("senha").value;
            let confirmar = document.getElementById("confirmar").value;

            if(senha !== confirmar){
                alert("Senhas diferentes");
                return;
            }

            fetch("../config/cadastrar.php",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    nome:document.getElementById("nome").value,
                    email:document.getElementById("email").value,
                    senha:senha,
                    escolaridade_id:document.getElementById("escolaridade").value
                })
            })
            .then(r=>r.json())
            .then(d=>{
                
                window.location="login.html";
            });

        }

    </script>
</body>

</html>
