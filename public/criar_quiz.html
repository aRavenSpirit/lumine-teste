<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Criar Quiz</title>
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="img/LUMINE-5con.ico">
</head>

<body>

    <a href="index.html">Voltar para pagina principal</a>

    <h2>Criar Quiz</h2>

    Nome:
    <input type="text" id="nome">
    <br><br>

    Dificuldade:
    <select id="dificuldade">
        <option value="">Selecione...</option>
    </select>
    <br><br>

    Matéria:
    <select id="materia" onchange="carregarConteudos()">
        <option value="">Selecione...</option>
    </select>

    <br><br>

    Conteúdo:
    <select id="conteudo">
        <option value="">Selecione...</option>
    </select>

    <br><br>

    <button onclick="addPergunta()">+ Pergunta</button>

    <div id="perguntas"></div>

    <br>
    <button onclick="salvarQuiz()">Salvar Quiz</button>

    <script>

        const api = "../config/criar_quiz.php";

        let perguntas = [];
        let tipos = [];

        window.onload = function () {
            carregarMaterias();
            carregarTipos();
            carregarDificuldades(); // ✅ NOVO
        }

        // =========================
        // NOVO: DIFICULDADE
        // =========================
        function carregarDificuldades() {

            fetch(api + "?tipo=dificuldade")
                .then(r => r.json())
                .then(dados => {

                    let select = document.getElementById("dificuldade");

                    dados.forEach(d => {
                        select.innerHTML += `
                            <option value="${d.id}">
                                ${d.dificuldade}
                            </option>
                        `;
                    });

                });

        }

        function carregarTipos() {
            fetch(api + "?tipo=tipos_perguntas")
                .then(r => r.json())
                .then(dados => {
                    tipos = dados;
                });
        }

        function carregarMaterias() {

            fetch(api + "?tipo=materia")
                .then(r => r.json())
                .then(dados => {

                    let select = document.getElementById("materia");

                    dados.forEach(m => {
                        select.innerHTML += `
                            <option value="${m.id}">
                                ${m.nome_materia}
                            </option>
                        `;
                    });

                });

        }

        function carregarConteudos() {

            let materia_id = document.getElementById("materia").value;

            let select = document.getElementById("conteudo");
            select.innerHTML = "<option>Carregando...</option>";

            fetch(api + "?tipo=conteudo&id_materia=" + materia_id)
                .then(r => r.json())
                .then(dados => {

                    select.innerHTML = "<option value=''>Selecione...</option>";

                    dados.forEach(c => {
                        select.innerHTML += `
                            <option value="${c.id}">
                                ${c.nome}
                            </option>
                        `;
                    });

                });

        }

        function addPergunta() {

            perguntas.push({
                descricao: "",
                tipo: "",
                respostas: []
            });

            render();
        }

        function removerPergunta(i) {
            perguntas.splice(i, 1);
            render();
        }

        function addResposta(i) {

            perguntas[i].respostas.push({
                descricao: "",
                certo: false
            });

            render();
        }

        function removerResposta(i, j) {
            perguntas[i].respostas.splice(j, 1);
            render();
        }

        function updatePergunta(i, valor) {
            perguntas[i].descricao = valor;
        }

        function updateTipo(i, tipo) {

            perguntas[i].tipo = tipo;
            perguntas[i].respostas = [];

            render();
        }

        function updateResposta(i, j, valor) {
            perguntas[i].respostas[j].descricao = valor;
        }

        function updateCorreta(i, j) {

            perguntas[i].respostas.forEach(r => r.certo = false);
            perguntas[i].respostas[j].certo = true;

            render();
        }

        function marcarMultipla(i, j, valor) {
            perguntas[i].respostas[j].certo = valor;
        }

        function setTexto(i, valor) {
            perguntas[i].resposta_texto = valor;
        }

        function setVF(i, valor) {
            perguntas[i].vf = valor;
        }

        function setOrdem(i, j, valor) {
            perguntas[i].respostas[j].ordem = valor;
        }

        function render() {

            let html = "";

            perguntas.forEach((p, i) => {

                html += `
                <div style="border:1px solid #000; padding:10px; margin:10px">

                    <button onclick="removerPergunta(${i})">Remover</button>

                    <br><br>

                    Pergunta:
                    <input onchange="updatePergunta(${i}, this.value)" value="${p.descricao}">

                    <br><br>

                    Tipo:
                    <select onchange="updateTipo(${i}, this.value)">
                        <option value="">Selecione...</option>
                `;

                tipos.forEach(t => {
                    html += `
                        <option value="${t.id}" ${p.tipo == t.id ? "selected" : ""}>
                            ${t.nome_tipo}
                        </option>
                    `;
                });

                html += `</select><br><br>`;

                if (p.tipo == 1) {

                    html += `<button onclick="addResposta(${i})">+ Resposta</button><ul>`;

                    p.respostas.forEach((r, j) => {

                        html += `
                        <li>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <input type="radio" name="correta_${i}"
                                onchange="updateCorreta(${i}, ${j})"
                                ${r.certo ? "checked" : ""}>
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>
                        `;
                    });

                    html += `</ul>`;
                }

                if (p.tipo == 2) {

                    html += `
                        Resposta:
                        <input onchange="setTexto(${i}, this.value)" value="${p.resposta_texto ?? ""}">
                    `;
                }

                if (p.tipo == 3) {

                    html += `
                        <label>
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, true)">
                            Verdadeiro
                        </label>

                        <label>
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, false)">
                            Falso
                        </label>
                    `;
                }

                if (p.tipo == 4) {

                    html += `<button onclick="addResposta(${i})">+ Resposta</button><ul>`;

                    p.respostas.forEach((r, j) => {

                        html += `
                        <li>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <input type="checkbox"
                                onchange="marcarMultipla(${i}, ${j}, this.checked)"
                                ${r.certo ? "checked" : ""}>
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>
                        `;
                    });

                    html += `</ul>`;
                }

                if (p.tipo == 5) {

                    html += `<button onclick="addResposta(${i})">+ Item</button><ul>`;

                    p.respostas.forEach((r, j) => {

                        html += `
                        <li>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            Ordem:
                            <input type="number" onchange="setOrdem(${i}, ${j}, this.value)">
                        </li>
                        `;
                    });

                    html += `</ul>`;
                }

                if (p.tipo == 6) {

                    html += `<button onclick="addResposta(${i})">+ Item</button><ul>`;

                    p.respostas.forEach((r, j) => {

                        html += `
                        <li draggable="true">
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                        </li>
                        `;
                    });

                    html += `</ul>`;
                }

                html += `</div>`;
            });

            document.getElementById("perguntas").innerHTML = html;
        }

        function salvarQuiz() {

            let nome = document.getElementById("nome").value.trim();
            let dificuldade = document.getElementById("dificuldade").value;
            let conteudo = document.getElementById("conteudo").value;

            if (!nome) return alert("Informe o nome");
            if (!dificuldade) return alert("Informe a dificuldade");
            if (!conteudo) return alert("Selecione o conteúdo");
            if (perguntas.length === 0) return alert("Adicione perguntas");

            for (let i = 0; i < perguntas.length; i++) {

                let p = perguntas[i];

                if (!p.descricao) return alert(`Pergunta ${i + 1} vazia`);
                if (!p.tipo) return alert(`Selecione tipo da pergunta ${i + 1}`);

                if (p.tipo == 1) {

                    if (p.respostas.length < 2) return alert(`Pergunta ${i + 1} precisa de 2 respostas`);

                    let corretas = p.respostas.filter(r => r.certo);
                    if (corretas.length !== 1) return alert(`Pergunta ${i + 1} precisa de 1 correta`);
                }

                if (p.tipo == 2 && !p.resposta_texto)
                    return alert(`Pergunta ${i + 1} precisa resposta`);

                if (p.tipo == 3 && p.vf === undefined)
                    return alert(`Pergunta ${i + 1} precisa VF`);
            }

            fetch(api + "?tipo=quiz_completo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome,
                    dificuldade,
                    id_conteudo: conteudo,
                    perguntas
                })
            })
                .then(r => r.json())
                .then(d => alert(d.mensagem || d.erro));
        }

    </script>

</body>

</html>
