<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Criar Quiz</title>
    <link rel="shortcut icon" href="img/LUMINEADM.ico" type="image/x-icon">
</head>

<body>

    <a href="index.html">Voltar para pagina principal</a>

    <h2>Criar Quiz</h2>

    Nome:
    <input type="text" id="nome">
    <br><br>

    Dificuldade:
    <select id="dificuldade">
        <option value="">Selecione...</option>
    </select>
    <br><br>

    Matéria:
    <select id="materia" onchange="carregarConteudos()">
        <option value="">Selecione...</option>
    </select>

    <br><br>

    Conteúdo:
    <select id="conteudo">
        <option value="">Selecione...</option>
    </select>

    <br><br>

    <button onclick="addPergunta()">+ Pergunta</button>

    <div id="perguntas"></div>

    <br>
    <button onclick="salvarQuiz()">Salvar Quiz</button>

    <script>

        const api = "../config/criar_quiz.php";

        let perguntas = [];
        let tipos = [];

        window.onload = function () {
            carregarMaterias();
            carregarTipos();
            carregarDificuldades(); 
        }

        function carregarDificuldades() {
            fetch(api + "?tipo=dificuldade")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("dificuldade");
                    dados.forEach(d => {
                        select.innerHTML += `
                            <option value="${d.id}">
                                ${d.dificuldade}
                            </option>
                        `;
                    });
                });
        }

        function carregarTipos() {
            fetch(api + "?tipo=tipos_perguntas")
                .then(r => r.json())
                .then(dados => {
                    tipos = dados;
                });
        }

        function carregarMaterias() {
            fetch(api + "?tipo=materia")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("materia");
                    dados.forEach(m => {
                        select.innerHTML += `
                            <option value="${m.id}">
                                ${m.nome_materia}
                            </option>
                        `;
                    });
                });
        }

        function carregarConteudos() {
            let materia_id = document.getElementById("materia").value;
            let select = document.getElementById("conteudo");
            select.innerHTML = "<option>Carregando...</option>";

            fetch(api + "?tipo=conteudo&id_materia=" + materia_id)
                .then(r => r.json())
                .then(dados => {
                    select.innerHTML = "<option value=''>Selecione...</option>";
                    dados.forEach(c => {
                        select.innerHTML += `
                            <option value="${c.id}">
                                ${c.nome}
                            </option>
                        `;
                    });
                });
        }

        function addPergunta() {
            perguntas.push({
                descricao: "",
                tipo: "",
                respostas: []
            });
            render();
        }

        function removerPergunta(i) {
            perguntas.splice(i, 1);
            render();
        }

        function addResposta(i) {
            perguntas[i].respostas.push({
                descricao: "",
                certo: false
            });
            render();
        }

        function removerResposta(i, j) {
            perguntas[i].respostas.splice(j, 1);
            render();
        }

        function updatePergunta(i, valor) {
            perguntas[i].descricao = valor;
        }

        function updateTextoAlvo(i, j, valor) {
            perguntas[i].respostas[j].texto_alvo = valor;
        }
        
        function updateTipo(i, tipo) {
            perguntas[i].tipo = tipo;
            perguntas[i].respostas = [];
            render();
        }

        function updateResposta(i, j, valor) {
            perguntas[i].respostas[j].descricao = valor;
        }

        function updateCorreta(i, j) {
            perguntas[i].respostas.forEach(r => r.certo = false);
            perguntas[i].respostas[j].certo = true;
            render();
        }

        function marcarMultipla(i, j, valor) {
            perguntas[i].respostas[j].certo = valor;
        }

        function setTexto(i, valor) {
            perguntas[i].resposta_texto = valor;
        }

        function setVF(i, valor) {
            perguntas[i].vf = valor;
        }

        function setOrdem(i, j, valor) {
            perguntas[i].respostas[j].ordem = parseInt(valor);
        }

        function render() {
            let html = "";

            perguntas.forEach((p, i) => {
                html += `
                <div style="border:1px solid #000; padding:10px; margin:10px">
                    <button onclick="removerPergunta(${i})">Remover</button>
                    <br><br>
                    Pergunta:
                    <input onchange="updatePergunta(${i}, this.value)" value="${p.descricao}">
                    <br><br>
                    Tipo:
                    <select onchange="updateTipo(${i}, this.value)">
                        <option value="">Selecione...</option>
                `;

                tipos.forEach(t => {
                    html += `
                        <option value="${t.id}" ${p.tipo == t.id ? "selected" : ""}>
                            ${t.nome_tipo}
                        </option>
                    `;
                });

                html += `</select><br><br>`;

                if (p.tipo == 1) {
                    html += `<button onclick="addResposta(${i})">+ Resposta</button><ul>`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <li>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <input type="radio" name="correta_${i}"
                                onchange="updateCorreta(${i}, ${j})"
                                ${r.certo ? "checked" : ""}>
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>
                        `;
                    });
                    html += `</ul>`;
                }

                if (p.tipo == 2) {
                    html += `
                        Resposta:
                        <input onchange="setTexto(${i}, this.value)" value="${p.resposta_texto ?? ""}">
                    `;
                }

                if (p.tipo == 3) {
                    html += `
                        <label>
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, true)" ${p.vf === true ? "checked" : ""}>
                            Verdadeiro
                        </label>
                        <label>
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, false)" ${p.vf === false ? "checked" : ""}>
                            Falso
                        </label>
                    `;
                }

                if (p.tipo == 4) {
                    html += `<button onclick="addResposta(${i})">+ Resposta</button><ul>`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <li>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <input type="checkbox"
                                onchange="marcarMultipla(${i}, ${j}, this.checked)"
                                ${r.certo ? "checked" : ""}>
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>
                        `;
                    });
                    html += `</ul>`;
                }

                // REFORMULADO: Tipo 5 Estilo Duolingo (Sem input de número, ordenação por inserção visual)
                if (p.tipo == 5) {
                    html += `<button onclick="addResposta(${i})">+ Adicionar Palavra/Item</button>`;
                    html += `<p style="margin: 5px 0;"><small><em>Escreva os itens rigorosamente na ordem correta (de cima para baixo):</em></small></p>`;
                    html += `<ol style="margin-top:5px;">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <li style="margin-bottom: 5px;">
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}" placeholder="Ex: item da posição ${j+1}" style="width: 250px;">
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>`;
                    });
                    html += `</ol>`;
                }

                if (p.tipo == 6) {
                    html += `<button onclick="addResposta(${i})">+ Adicionar Par (Caixa e Resposta)</button><ul style="list-style:none">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <li style="padding:10px; border:1px dashed #ccc; margin-bottom:10px; background:#f9f9f9">
                            <strong>Par ${j+1}:</strong><br>
                            <small>Texto na Caixa (Alvo):</small><br>
                            <input onchange="updateTextoAlvo(${i}, ${j}, this.value)" value="${r.texto_alvo ?? ''}" placeholder="Ex: Capital da França" style="width:70%"><br>
                            
                            <small>Item para Arrastar (Resposta):</small><br>
                            <input onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}" placeholder="Ex: Paris" style="width:70%">
                            
                            <button onclick="removerResposta(${i}, ${j})">Remover</button>
                        </li>`;
                    });
                    html += `</ul>`;
                }

                html += `</div>`;
            });

            document.getElementById("perguntas").innerHTML = html;
        }

        let dragSourceIndex = null;

        function dragStart(i, j) {
            dragSourceIndex = j;
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(i, targetIndex) {
            const movido = perguntas[i].respostas.splice(dragSourceIndex, 1)[0];
            perguntas[i].respostas.splice(targetIndex, 0, movido);
            render();
        }

        function salvarQuiz() {
            let nome = document.getElementById("nome").value.trim();
            let difficulty = document.getElementById("dificuldade").value;
            let conteudo = document.getElementById("conteudo").value;

            if (!nome) return alert("Informe o nome");
            if (!difficulty) return alert("Informe a dificuldade");
            if (!conteudo) return alert("Selecione o conteúdo");
            if (perguntas.length === 0) return alert("Adicione perguntas");

            for (let i = 0; i < perguntas.length; i++) {
                let p = perguntas[i];

                if (!p.descricao) return alert(`Pergunta ${i + 1} vazia`);
                if (!p.tipo) return alert(`Selecione tipo da pergunta ${i + 1}`);

                if (p.tipo == 1) {
                    if (p.respostas.length < 2) return alert(`Pergunta ${i + 1} precisa de 2 respostas`);
                    let corretas = p.respostas.filter(r => r.certo);
                    if (corretas.length !== 1) return alert(`Pergunta ${i + 1} precisa de 1 correta`);
                }

                if (p.tipo == 2 && !p.resposta_texto)
                    return alert(`Pergunta ${i + 1} precisa resposta`);

                if (p.tipo == 3 && p.vf === undefined)
                    return alert(`Pergunta ${i + 1} precisa VF`);

                // REFORMULADO: Validação unificada para os tipos 5 e 6
                if (p.tipo == 5 || p.tipo == 6) {
                    if (p.respostas.length < 2) 
                        return alert(`Pergunta ${i + 1} precisa de pelo menos 2 itens.`);
                    
                    // Vincula a propriedade 'ordem' baseada na ordem estrutural do array (1, 2, 3...) de forma automatizada
                    p.respostas.forEach((r, idx) => r.ordem = idx + 1);
                }
            }

            fetch(api + "?tipo=quiz_completo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome,
                    dificuldade: difficulty,
                    id_conteudo: conteudo,
                    perguntas
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.erro) alert("Erro: " + d.erro);
                else alert(d.mensagem || "Quiz salvo com sucesso!");
            })
            .catch(err => alert("Erro ao conectar com o servidor"));
        }

    </script>

</body>

</html>
