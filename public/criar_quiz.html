<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Criar Quiz</title>
    <link rel="stylesheet" href="style/criar_quiz.css">
    <link rel="shortcut icon" href="img/LUMINEADM.ico" type="image/x-icon">
</head>

<body>

    <header class="navbar-container">
        <button class="nav-btn btn-back-top" onclick="window.location.href='admin_dashboard.html'">Voltar</button>
        <div class="nav-pill title-pill">CRIAÇÃO DE QUIZ</div>
        <button class="nav-btn btn-danger-top" onclick="window.location.reload()">APAGAR QUIZ</button>
        <button class="nav-btn btn-success-top" onclick="salvarQuiz()">CRIAR QUIZ</button>
    </header>

    <main class="main-card">
        <div class="back-link-container">
            <a href="index.html" class="back-link">Voltar para pagina principal</a>
        </div>

        <div class="quiz-header-form">
            <div class="input-group">
                Nome:
                <input type="text" id="nome" placeholder="Nome do novo Quiz" class="custom-input main-input">
            </div>

            <div class="input-group select-wrapper">
                Dificuldade:
                <select id="dificuldade" class="custom-select small-select">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="input-group select-wrapper">
                Matéria:
                <select id="materia" onchange="carregarConteudos()" class="custom-select">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <div class="input-group select-wrapper">
                Conteúdo:
                <select id="conteudo" class="custom-select">
                    <option value="">Selecione...</option>
                </select>
            </div>

            <button class="btn-add-question" onclick="addPergunta()">+ Pergunta</button>
        </div>

        <div id="perguntas"></div>
    </main>

    <script>

        const api = "../config/criar_quiz.php";

        let perguntas = [];
        let tipos = [];

        window.onload = function () {
            carregarMaterias();
            carregarTipos();
            carregarDificuldades(); 
        }

        function carregarDificuldades() {
            fetch(api + "?tipo=dificuldade")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("dificuldade");
                    dados.forEach(d => {
                        select.innerHTML += `
                            <option value="${d.id}">
                                ${d.dificuldade}
                            </option>
                        `;
                    });
                });
        }

        function carregarTipos() {
            fetch(api + "?tipo=tipos_perguntas")
                .then(r => r.json())
                .then(dados => {
                    tipos = dados;
                });
        }

        function carregarMaterias() {
            fetch(api + "?tipo=materia")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("materia");
                    dados.forEach(m => {
                        select.innerHTML += `
                            <option value="${m.id}">
                                ${m.nome_materia}
                            </option>
                        `;
                    });
                });
        }

        function carregarConteudos() {
            let materia_id = document.getElementById("materia").value;
            let select = document.getElementById("conteudo");
            select.innerHTML = "<option>Carregando...</option>";

            fetch(api + "?tipo=conteudo&id_materia=" + materia_id)
                .then(r => r.json())
                .then(dados => {
                    select.innerHTML = "<option value=''>Selecione...</option>";
                    dados.forEach(c => {
                        select.innerHTML += `
                            <option value="${c.id}">
                                ${c.nome}
                            </option>
                        `;
                    });
                });
        }

        function addPergunta() {
            perguntas.push({
                descricao: "",
                tipo: "",
                respostas: []
            });
            render();
        }

        function removerPergunta(i) {
            perguntas.splice(i, 1);
            render();
        }

        function addResposta(i) {
            perguntas[i].respostas.push({
                descricao: "",
                certo: false
            });
            render();
        }

        function removerResposta(i, j) {
            perguntas[i].respostas.splice(j, 1);
            render();
        }

        function updatePergunta(i, valor) {
            perguntas[i].descricao = valor;
        }

        function updateTextoAlvo(i, j, valor) {
            perguntas[i].respostas[j].texto_alvo = valor;
        }
        
        function updateTipo(i, tipo) {
            perguntas[i].tipo = tipo;
            perguntas[i].respostas = [];
            render();
        }

        function updateResposta(i, j, valor) {
            perguntas[i].respostas[j].descricao = valor;
        }

        function updateCorreta(i, j) {
            perguntas[i].respostas.forEach(r => r.certo = false);
            perguntas[i].respostas[j].certo = true;
            render();
        }

        function marcarMultipla(i, j, valor) {
            perguntas[i].respostas[j].certo = valor;
        }

        function setTexto(i, valor) {
            perguntas[i].resposta_texto = valor;
        }

        function setVF(i, valor) {
            perguntas[i].vf = valor;
            render();
        }

        function setOrdem(i, j, valor) {
            perguntas[i].respostas[j].ordem = parseInt(valor);
        }

        function render() {
            let html = "";

            perguntas.forEach((p, i) => {
                html += `
                <div class="question-card">
                    <div class="question-header">
                        <div>
                            Pergunta:
                            <input class="custom-input question-title-input" onchange="updatePergunta(${i}, this.value)" value="${p.descricao}">
                        </div>
                        <button class="btn-remove" onclick="removerPergunta(${i})">Remover</button>
                    </div>
                    
                    <div class="select-wrapper type-select-wrapper">
                        Tipo:
                        <select class="custom-select" onchange="updateTipo(${i}, this.value)">
                            <option value="">Selecione...</option>
                `;

                tipos.forEach(t => {
                    html += `
                        <option value="${t.id}" ${p.tipo == t.id ? "selected" : ""}>
                            ${t.nome_tipo}
                        </option>
                    `;
                });

                html += `</select></div><br>`;

                if (p.tipo == 1) {
                    html += `<button class="btn-add-item" onclick="addResposta(${i})">+ Respostas</button><div class="answers-container flex-row">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <div class="answer-pill-box">
                            <button class="btn-inline-remove" onclick="removerResposta(${i}, ${j})">×</button>
                            <input class="inner-pill-input" onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <label class="custom-radio-checkbox">
                                <input type="radio" name="correta_${i}"
                                    onchange="updateCorreta(${i}, ${j})"
                                    ${r.certo ? "checked" : ""}>
                                <span class="radio-mark"></span>
                            </label>
                        </div>
                        `;
                    });
                    html += `</div>`;
                }

                if (p.tipo == 2) {
                    html += `
                    <div class="answers-container">
                        Resposta:
                        <input class="custom-input text-answer-input" onchange="setTexto(${i}, this.value)" value="${p.resposta_texto ?? ""}">
                    </div>
                    `;
                }

                if (p.tipo == 3) {
                    html += `
                    <div class="answers-container vf-container">
                        <label class="vf-label-wrapper">
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, true)" ${p.vf === true ? "checked" : ""}>
                            <span class="vf-btn vf-true">Verdadeiro <span class="dot-indicator"></span></span>
                        </label>
                        <label class="vf-label-wrapper">
                            <input type="radio" name="vf_${i}" onchange="setVF(${i}, false)" ${p.vf === false ? "checked" : ""}>
                            <span class="vf-btn vf-false">Falso <span class="dot-indicator"></span></span>
                        </label>
                    </div>
                    `;
                }

                if (p.tipo == 4) {
                    html += `<button class="btn-add-item" onclick="addResposta(${i})">+ Respostas</button><div class="answers-container flex-row">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <div class="answer-pill-box">
                            <button class="btn-inline-remove" onclick="removerResposta(${i}, ${j})">×</button>
                            <input class="inner-pill-input" onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}">
                            <input type="checkbox"
                                onchange="marcarMultipla(${i}, ${j}, this.checked)"
                                ${r.certo ? "checked" : ""}>
                        </div>
                        `;
                    });
                    html += `</div>`;
                }

                if (p.tipo == 5) {
                    html += `<button class="btn-add-item" onclick="addResposta(${i})">+ Adicionar Palavra/Item</button>`;
                    html += `<p style="margin: 5px 0;"><small><em>Escreva os itens rigorosamente na ordem correta (de cima para baixo):</em></small></p>`;
                    html += `<div class="answers-container drag-drop-container"><div class="drag-arrow-indicator"></div><div class="drag-items-list">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <div class="answer-pill-box drag-pill">
                            <button class="btn-inline-remove" onclick="removerResposta(${i}, ${j})">×</button>
                            <input class="inner-pill-input full-width" onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}" placeholder="Ex: item da posição ${j+1}">
                        </div>`;
                    });
                    html += `</div></div>`;
                }

                if (p.tipo == 6) {
                    html += `<button class="btn-add-item" onclick="addResposta(${i})">+ Adicionar Par (Caixa e Resposta)</button>`;
                    html += `<div class="answers-container matching-container">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                        <div class="matching-row">
                            <div class="match-box-left">
                                <input class="inner-pill-input full-width" onchange="updateTextoAlvo(${i}, ${j}, this.value)" value="${r.texto_alvo ?? ''}" placeholder="Ex: Capital da França">
                            </div>
                            <div class="match-arrow"></div>
                            <div class="match-box-right">
                                <input class="inner-pill-input full-width" onchange="updateResposta(${i}, ${j}, this.value)" value="${r.descricao}" placeholder="Ex: Paris">
                                <button class="btn-inline-remove margin-left" onclick="removerResposta(${i}, ${j})">×</button>
                            </div>
                        </div>`;
                    });
                    html += `</div>`;
                }

                html += `</div>`;
            });

            document.getElementById("perguntas").innerHTML = html;
        }

        let dragSourceIndex = null;

        function dragStart(i, j) {
            dragSourceIndex = j;
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(i, targetIndex) {
            const movido = perguntas[i].respostas.splice(dragSourceIndex, 1)[0];
            perguntas[i].respostas.splice(targetIndex, 0, movido);
            render();
        }

        function salvarQuiz() {
            let nome = document.getElementById("nome").value.trim();
            let difficulty = document.getElementById("dificuldade").value;
            let conteudo = document.getElementById("conteudo").value;

            if (!nome) return alert("Informe o nome");
            if (!difficulty) return alert("Informe a dificuldade");
            if (!conteudo) return alert("Selecione o conteúdo");
            if (perguntas.length === 0) return alert("Adicione perguntas");

            for (let i = 0; i < perguntas.length; i++) {
                let p = perguntas[i];

                if (!p.descricao) return alert(`Pergunta ${i + 1} vazia`);
                if (!p.tipo) return alert(`Selecione tipo da pergunta ${i + 1}`);

                if (p.tipo == 1) {
                    if (p.respostas.length < 2) return alert(`Pergunta ${i + 1} precisa de 2 respostas`);
                    let corretas = p.respostas.filter(r => r.certo);
                    if (corretas.length !== 1) return alert(`Pergunta ${i + 1} precisa de 1 correta`);
                }

                if (p.tipo == 2 && !p.resposta_texto)
                    return alert(`Pergunta ${i + 1} precisa resposta`);

                if (p.tipo == 3 && p.vf === undefined)
                    return alert(`Pergunta ${i + 1} precisa VF`);

                if (p.tipo == 5 || p.tipo == 6) {
                    if (p.respostas.length < 2) 
                        return alert(`Pergunta ${i + 1} precisa de pelo menos 2 itens.`);
                    
                    p.respostas.forEach((r, idx) => r.ordem = idx + 1);
                }
            }

            fetch(api + "?tipo=quiz_completo", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome,
                    dificuldade: difficulty,
                    id_conteudo: conteudo,
                    perguntas
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.erro) alert("Erro: " + d.erro);
                else alert(d.mensagem || "Quiz salvo com sucesso!");
            })
            .catch(err => alert("Erro ao conectar com o servidor"));
        }

    </script>

</body>

</html>
