<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LUMINE</title>
    <link rel="stylesheet" href="./style/login.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/navegacao-teclado.js" defer></script>
    <script src="js/tamanho_fonte.js"></script>
    <style>
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.ativo {
            display: flex;
        }
        .modal-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .modal-box h2 {
            margin-bottom: 10px;
            color: #333;
        }
        .modal-box select {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        .modal-box button {
            background-color: #2b78e4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .modal-box button:hover {
            background-color: #1a5bb8;
        }
    </style>
</head>
<body>
    <div class="container-login">
        <div class="area-icone">
            <a href="index.php"><img src="img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-log">Login</h1>
        
        <div class="conteudo-form"> 
            <div class="blocos-log">
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" id="email" required>
                </div>
                
                <div class="input-group">
                    <input type="password" name="senha" placeholder="Senha" id="senha" required>
                    <a href="esqueceu_senha.html" class="esqueceu-senha">Esqueceu a senha?</a>
                </div>

                <div id="mensagem"></div>
            </div>

            <div class="area-botao">
                <button onclick="login()" class="botao-login">Entrar</button>
            </div>
        </div>

        <div class="divisor">
            <span>ou entre com</span>
        </div>

        <div class="area-google">
            <div id="g_id_onload"
                data-client_id="369242179296-3p1mokk6kksdhtcgl7puf7cjbj8e70kr.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-size="large" data-width="100%"></div>
        </div>

        <p class="texto-cadastro">Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se</a></p>
    </div>

    <!-- Modal de Seleção de Escolaridade -->
    <div id="modal-escolaridade" class="modal-overlay">
        <div class="modal-box">
            <h2>Quase lá!</h2>
            <p>Selecione a sua escolaridade para personalizarmos os seus conteúdos:</p>
            <select id="select-escolaridade">
                <option value="">A carregar opções...</option>
            </select>
            <div id="msg-modal" style="color: red; margin-bottom: 10px; font-size: 0.9rem;"></div>
            <button onclick="salvarEscolaridade()">Continuar</button>
        </div>
    </div>

    <script>
        const inputs = document.querySelectorAll('#email, #senha');
        inputs.forEach(input => {
            input.addEventListener('input', () => {
                const msg = document.getElementById("mensagem");
                msg.className = ""; 
                setTimeout(() => {
                    if(!msg.classList.contains('caixa-erro')) {
                        msg.innerHTML = "";
                    }
                }, 400);
            });
        });

        function exibirErro(texto) {
            const msg = document.getElementById("mensagem");
            msg.innerHTML = texto;
            msg.className = "caixa-erro";
        }

        function mostrarModalEscolaridade() {
            const modal = document.getElementById("modal-escolaridade");
            modal.classList.add("ativo");
            
            fetch("../config/api.php?tipo=escolaridade")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("select-escolaridade");
                    select.innerHTML = '<option value="">Selecione a sua escolaridade</option>';
                    dados.forEach(e => {
                        select.innerHTML += `<option value="${e.id_escolaridade}">${e.nome_escolaridade}</option>`;
                    });
                })
                .catch(err => {
                    document.getElementById("msg-modal").innerText = "Erro ao carregar escolaridades.";
                });
        }

        function salvarEscolaridade() {
            const esc = document.getElementById("select-escolaridade").value;
            if(!esc) {
                document.getElementById("msg-modal").innerText = "Por favor, escolha uma opção!";
                return;
            }
            
            fetch("../config/salvar_escolaridade.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ escolaridade_id: esc })
            })
            .then(r => r.json())
            .then(d => {
                if(d.status) {
                    window.location = "home.php";
                } else {
                    document.getElementById("msg-modal").innerText = d.erro || "Erro ao salvar.";
                }
            })
            .catch(() => {
                document.getElementById("msg-modal").innerText = "Erro ao conectar com o servidor.";
            });
        }

        function handleCredentialResponse(response) {
            exibirErro("A autenticar...");
            
            fetch("../config/login_google.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: response.credential })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status) {
                    if (d.precisa_escolaridade) {
                        exibirErro("");
                        mostrarModalEscolaridade();
                    } else {
                        window.location = "home.php";
                    }
                } else {
                    exibirErro("Erro Google: " + (d.erro || "Falha ao entrar"));
                }
            })
            .catch(() => exibirErro("Erro ao conectar com o servidor."));
        }

        function login() {
            const emailField = document.getElementById("email");
            const senhaField = document.getElementById("senha");
            const email = emailField.value.trim();
            const senha = senhaField.value;

            if (!email || !senha) {
                exibirErro("Preencha todos os campos");
                return;
            }

            fetch("../config/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, senha: senha })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status) {
                    if (d.precisa_escolaridade) {
                        exibirErro("");
                        mostrarModalEscolaridade();
                    } else {
                        window.location = "home.php";
                    }
                } else {
                    exibirErro("E-mail ou senha inválidos");
                    emailField.value = "";
                    senhaField.value = "";
                }
            })
            .catch(() => exibirErro("Erro ao conectar com o servidor."));
        }
    </script>
</body>
</html>
