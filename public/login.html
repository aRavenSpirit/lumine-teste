<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LUMINE</title>
    <link rel="stylesheet" href="./style/login.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
</head>
<body>
    <div class="container-login">
        <div class="area-icone">
            <a href="index.html"><img src="img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-log">Login</h1>
        
        <div class="conteudo-form"> 
            <div class="blocos-log">
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" id="email" required>
                </div>
                
                <div class="input-group">
                    <input type="password" name="senha" placeholder="Senha" id="senha" required>
                    <a href="#" class="esqueceu-senha">Esqueceu a senha?</a>
                </div>

                <div class="area-extra">
                    <label class="checkbox-container">
                        <input type="checkbox" id="salvar-senha">
                        <span class="checkmark"></span>
                        Salvar senha
                    </label>
                </div>

                <div id="mensagem" style="text-align: center; color: red; font-size: 14px; margin-top: 5px;"></div>
            </div>

            <div class="area-botao">
                <button onclick="login()" class="botao-login">Entrar</button>
            </div>
        </div>

        <div class="divisor">
            <span>ou entre com</span>
        </div>

        <div class="area-google">
            <div id="g_id_onload"
                data-client_id="369242179296-3p1mokk6kksdhtcgl7puf7cjbj8e70kr.apps.googleusercontent.com"
                data-context="signin"
                data-ux_mode="popup"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-size="large" data-width="100%"></div>
        </div>

        <p class="texto-cadastro">Ainda não tem cadastro? <a href="cadastro.html">Cadastre-se</a></p>

        <div id="modal-escolaridade" class="modal-overlay">
            <div class="modal-content">
                <h2>Quase lá! </h2>
                <p>Para adaptarmos a plataforma Lumine ao seu perfil, selecione o seu nível de escolaridade atual:</p>
                
                <select id="select-escolaridade">
                    <option value="">A carregar opções...</option>
                </select>
                
                <div id="msg-modal" style="color: #dc2626; margin-bottom: 12px; font-size: 14px; font-weight: 500;"></div>
                
                <button onclick="salvarEscolaridade()" class="botao-modal">Confirmar e Entrar</button>
            </div>
        </div>
    </div>

    <script>
        // Função indispensável para exibir mensagens de aviso/erro na tela
        function exibirErro(texto) {
            const msg = document.getElementById("mensagem");
            if (msg) msg.innerText = texto;
        }

        function mostrarModalEscolaridade() {
            document.getElementById("modal-escolaridade").classList.add("ativo");
            
            // Procura dinamicamente as escolaridades cadastradas no sistema
            fetch("../config/api.php?tipo=escolaridade")
                .then(r => r.json())
                .then(dados => {
                    let select = document.getElementById("select-escolaridade");
                    select.innerHTML = '<option value="">Selecione a sua escolaridade</option>';
                    dados.forEach(e => {
                        select.innerHTML += `<option value="${e.id_escolaridade}">${e.nome_escolaridade}</option>`;
                    });
                })
                .catch(() => {
                    document.getElementById("msg-modal").innerText = "Erro ao carregar lista de escolaridades.";
                });
        }

        function salvarEscolaridade() {
            const esc = document.getElementById("select-escolaridade").value;
            if(!esc) {
                document.getElementById("msg-modal").innerText = "Por favor, escolha uma opção!";
                return;
            }
            
            fetch("../config/salvar_escolaridade.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ escolaridade_id: esc })
            })
            .then(r => r.json())
            .then(d => {
                if(d.status) {
                    window.location = "home.php";
                } else {
                    document.getElementById("msg-modal").innerText = "Erro: " + d.erro;
                }
            })
            .catch(() => {
                document.getElementById("msg-modal").innerText = "Erro na ligação com o servidor.";
            });
        }

        function handleCredentialResponse(response) {
            exibirErro("A autenticar...");
            fetch("../config/login_google.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: response.credential })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status) {
                    if(d.precisa_escolaridade) {
                        exibirErro(""); // Limpa texto "A autenticar..."
                        mostrarModalEscolaridade();
                    } else {
                        window.location = "home.php";
                    }
                } else {
                    exibirErro("Erro Google: " + (d.erro || "Falha desconhecida"));
                }
            })
            .catch(() => exibirErro("Erro ao conectar com o servidor."));
        }

        function login() {
            const emailField = document.getElementById("email");
            const senhaField = document.getElementById("senha");
            const email = emailField.value.trim();
            const senha = senhaField.value;

            if (!email || !senha) {
                exibirErro("Preencha todos os campos");
                return;
            }

            fetch("../config/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, senha: senha })
            })
            .then(r => r.json())
            .then(d => {
                if (d.status) {
                    if(d.precisa_escolaridade) {
                        mostrarModalEscolaridade();
                    } else {
                        window.location = "home.php";
                    }
                } else {
                    exibirErro("E-mail ou senha inválidos");
                    emailField.value = "";
                    senhaField.value = "";
                }
            })
            .catch(() => exibirErro("Erro ao conectar com o servidor."));
        }
    </script>
</body>
</html>
