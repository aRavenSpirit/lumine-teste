<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Quiz - LUMINE</title>
    <link rel="shortcut icon" href="img/LUMINEADM.ico" type="image/x-icon">
    <link rel="stylesheet" href="./style/editar_quiz.css">
</head>
<body>

    <div class="navbar-container">
        <div class="nav-pill title-pill">LUMINE ADM</div>
        <a href="admin_dashboard.php" class="nav-btn btn-back-top" style="text-decoration: none;">← Voltar ao Painel</a>
        <div class="nav-pill adm-pill">QUIZ</div>
    </div>

    <div class="main-card">
        <h2>Editar Quiz</h2>
        <br>

        <div id="dados-quiz" class="quiz-header-form">
            <p><strong>Nome Atual:</strong> <span id="label-nome"></span> <button class="btn-inline-edit" onclick="mostrarEdit('quiz-nome')">Alterar</button></p>
            <div id="edit-quiz-nome" style="display:none" class="edit-section">
                <input type="text" id="input-nome" class="custom-input main-input">
            </div>

            <p><strong>Dificuldade Atual:</strong> <span id="label-dificuldade"></span> <button class="btn-inline-edit" onclick="mostrarEdit('quiz-dif')">Alterar</button></p>
            <div id="edit-quiz-dif" style="display:none" class="edit-section">
                <select id="select-dificuldade" class="custom-select small-select"></select>
            </div>

            <p><strong>Matéria/Conteúdo Atual:</strong> <span id="label-conteudo"></span> <button class="btn-inline-edit" onclick="mostrarEdit('quiz-cont')">Alterar</button></p>
            <div id="edit-quiz-cont" style="display:none" class="edit-section row-fields">
                <div class="field-group">
                    <label>Matéria:</label>
                    <select id="select-materia" class="custom-select" onchange="carregarConteudos()"></select>
                </div>
                <div class="field-group">
                    <label>Conteúdo:</label>
                    <select id="select-conteudo" class="custom-select"></select>
                </div>
            </div>
        </div>

        <hr class="custom-hr">
        <h3>Perguntas do Quiz</h3>
        
        <div id="perguntas-container"></div>
        
        <br>
        <button onclick="addPergunta()" class="btn-add-question">+ Adicionar Nova Pergunta</button>
        <br><br>
        <hr class="custom-hr">
        
        <button onclick="salvarAlteracoes()" class="btn-save-bottom">SALVAR TODAS AS ALTERAÇÕES NO QUIZ</button>
    </div>

    <!-- ESTRUTURA DA MODAL DO ADMINISTRADOR -->
<div id="modalAdminAviso" class="modal-overlay-admin" style="display: none;">
    <div class="modal-card-admin">
        <h3 id="modalAdminTitulo">MENSAGEM DO SISTEMA</h3>
        <p id="modalAdminMensagem">Conteúdo da mensagem aqui...</p>
        <div id="modalAdminBotoes" class="modal-buttons-admin">
            <!-- Botões dinâmicos via JS -->
        </div>
    </div>
</div>

<script>
        const api = "../config/criar_quiz.php"; 
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('id');

        let perguntas = [];
        let tipos = [];
        let callbackConfirmacaoAdmin = null;

        // ==========================================================
        // SISTEMA DE MODAL PERSONALIZADA PARA O ADMINISTRADOR
        // ==========================================================
        function alertAdmin(mensagem, titulo = "ATENÇÃO", callbackFechar = null) {
            document.getElementById('modalAdminTitulo').innerText = titulo;
            document.getElementById('modalAdminMensagem').innerText = mensagem;
            
            const containerBotoes = document.getElementById('modalAdminBotoes');
            containerBotoes.innerHTML = `
                <button type="button" class="btn-admin-ok" onclick="fecharModalAdmin(true)">OK</button>
            `;
            
            callbackConfirmacaoAdmin = callbackFechar;
            document.getElementById('modalAdminAviso').style.display = 'flex';
        }

        function confirmAdmin(mensagem, acaoSim, titulo = "CONFIRMAÇÃO") {
            document.getElementById('modalAdminTitulo').innerText = titulo;
            document.getElementById('modalAdminMensagem').innerText = mensagem;
            
            const containerBotoes = document.getElementById('modalAdminBotoes');
            containerBotoes.innerHTML = `
                <button type="button" class="btn-admin-nao" onclick="fecharModalAdmin(false)">Cancelar</button>
                <button type="button" class="btn-admin-sim" id="btnAdminConfirmarSim">OK</button>
            `;

            document.getElementById('btnAdminConfirmarSim').onclick = async function() {
                fecharModalAdmin(false);
                if (typeof acaoSim === 'function') await acaoSim();
            };

            document.getElementById('modalAdminAviso').style.display = 'flex';
        }

        function fecharModalAdmin(executarCallback = false) {
            document.getElementById('modalAdminAviso').style.display = 'none';
            if (executarCallback && typeof callbackConfirmacaoAdmin === 'function') {
                const cb = callbackConfirmacaoAdmin;
                callbackConfirmacaoAdmin = null;
                cb();
            }
        }
        // ==========================================================

        window.onload = async function () {
            if (!quizId) return alertAdmin("ID do quiz não encontrado!", "ERRO");
            
            await carregarTipos();
            await carregarListasIniciais();
            await carregarDadosDoQuiz();
        }

        function mostrarEdit(id) {
            let el = document.getElementById('edit-' + id);
            el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        async function carregarTipos() {
            const r = await fetch(api + "?tipo=tipos_perguntas");
            tipos = await r.json();
        }

        async function carregarListasIniciais() {
            const rMat = await fetch(api + "?tipo=materia");
            const materias = await rMat.json();
            let selMat = document.getElementById("select-materia");
            selMat.innerHTML = '<option value="">Selecione a Matéria</option>';
            materias.forEach(m => selMat.innerHTML += `<option value="${m.id}">${m.nome_materia}</option>`);

            const rDif = await fetch(api + "?tipo=dificuldade");
            const difs = await rDif.json();
            let selDif = document.getElementById("select-dificuldade");
            selDif.innerHTML = '<option value="">Selecione...</option>';
            difs.forEach(d => selDif.innerHTML += `<option value="${d.id}">${d.dificuldade}</option>`);
        }

        async function carregarConteudos(targetConteudoId = null) {
            let matId = document.getElementById("select-materia").value;
            if (!matId) return;

            const r = await fetch(api + "?tipo=conteudo&id_materia=" + matId);
            const dados = await r.json();
            let selCont = document.getElementById("select-conteudo");
            selCont.innerHTML = '<option value="">Selecione o Conteúdo</option>';
            
            dados.forEach(c => {
                const selected = (targetConteudoId && c.id == targetConteudoId) ? "selected" : "";
                selCont.innerHTML += `<option value="${c.id}" ${selected}>${c.nome}</option>`;
            });
        }

        async function carregarDadosDoQuiz() {
            const r = await fetch(`../config/quiz.php?tipo=detalhes_quiz&id=${quizId}`);
            const data = await r.json();

            document.getElementById('label-nome').innerText = data.nome;
            document.getElementById('label-dificuldade').innerText = data.dificuldade;
            document.getElementById('label-conteudo').innerText = data.nome_materia + " / " + data.conteudo;
            
            document.getElementById('input-nome').value = data.nome;
            document.getElementById('select-dificuldade').value = data.id_dificuldade;
            document.getElementById('select-materia').value = data.id_materia;
            
            await carregarConteudos(data.id_conteudo);

            perguntas = data.perguntas.map(p => {
                let respostasOrdenadas = p.respostas;
                if (p.id_tipo == 5 || p.id_tipo == 6) {
                    respostasOrdenadas.sort((a, b) => parseInt(a.ordem) - parseInt(b.ordem));
                }

                return {
                    id: p.id,
                    descricao: p.descricao,
                    tipo: p.id_tipo,
                    respostas: respostasOrdenadas.map(r => ({
                        id: r.id,
                        descricao: r.descricao,
                        certo: r.certo == 1,
                        ordem: r.ordem,
                        texto_alvo: r.texto_alvo || ""
                    })),
                    resposta_texto: p.id_tipo == 2 ? (p.respostas[0]?.descricao || "") : "",
                    vf: p.id_tipo == 3 ? (p.respostas[0]?.descricao === 'Verdadeiro') : undefined
                };
            });

            render();
        }

        function render() {
            let container = document.getElementById("perguntas-container");
            container.innerHTML = "";

            perguntas.forEach((p, i) => {
                let div = document.createElement("div");
                div.className = "question-card";
                
                let html = `
                    <div class="question-header">
                        <strong>Pergunta ${i + 1}</strong>
                        <button onclick="removerPergunta(${i})" class="btn-remove">Remover Pergunta</button>
                    </div>
                    <div class="question-body">
                        <label>Descrição:</label>
                        <input class="custom-input question-title-input" oninput="perguntas[${i}].descricao = this.value" value="${p.descricao}">
                    </div>
                    <div class="question-body">
                        <label>Tipo:</label>
                        <div class="type-select-wrapper">
                            <select class="custom-select" onchange="updateTipo(${i}, this.value)">
                                <option value="">Selecione...</option>
                                ${tipos.map(t => `<option value="${t.id}" ${p.tipo == t.id ? "selected" : ""}>${t.nome_tipo}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;

                // 1 e 4: MULTIPLA ESCOLHA / CAIXA DE SELEÇÃO
                if (p.tipo == 1 || p.tipo == 4) {
                    html += `
                    <div class="answers-container">
                        <button class="btn-add-item" onclick="addResposta(${i})">+ Adicionar Opção</button>
                        <div class="flex-row">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                            <div class="answer-pill-box">
                                <input class="inner-pill-input" oninput="perguntas[${i}].respostas[${j}].descricao = this.value" value="${r.descricao}" placeholder="Opção">
                                <label class="check-label-wrapper">
                                     <input type="${p.tipo == 1 ? 'radio' : 'checkbox'}" name="c_${i}" 
                                        onchange="setCorreta(${i}, ${j}, this)" ${r.certo ? "checked" : ""}>
                                </label>
                                <button onclick="removerResposta(${i}, ${j})" class="btn-inline-remove">X</button>
                            </div>`;
                    });
                    html += `</div></div>`;
                } 
                // 2: TEXTO
                else if (p.tipo == 2) {
                    html += `
                    <div class="answers-container">
                        <label>Resposta correta (Texto):</label><br>
                        <input class="custom-input text-answer-input" oninput="perguntas[${i}].resposta_texto = this.value" value="${p.resposta_texto}">
                    </div>`;
                } 
                // 3: VERDADEIRO OU FALSO
                else if (p.tipo == 3) {
                    html += `
                    <div class="answers-container">
                        <div class="vf-container">
                            <label class="vf-label-wrapper">
                                <input type="radio" name="vf_${i}" onchange="perguntas[${i}].vf = true" ${p.vf === true ? "checked" : ""}>
                                <div class="vf-btn vf-true">Verdadeiro <span class="dot-indicator"></span></div>
                            </label>
                            <label class="vf-label-wrapper">
                                <input type="radio" name="vf_${i}" onchange="perguntas[${i}].vf = false" ${p.vf === false ? "checked" : ""}>
                                <div class="vf-btn vf-false">Falso <span class="dot-indicator"></span></div>
                            </label>
                        </div>
                    </div>`;
                }
                // 5: ORDENAR ITENS
                else if (p.tipo == 5) {
                    html += `
                    <div class="answers-container">
                        <p class="section-instruction">Defina os itens abaixo na <strong>ordem sequencial exata</strong> (1º ao último):</p>
                        <button class="btn-add-item" onclick="addResposta(${i})">+ Adicionar Item à Sequência</button>
                        <div class="drag-drop-container">
                            <div class="drag-arrow-indicator"></div>
                            <div class="drag-items-list">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                                <div class="answer-pill-box drag-pill full-width">
                                    <span class="order-number">${j+1}º</span>
                                    <input class="inner-pill-input" oninput="perguntas[${i}].respostas[${j}].descricao = this.value" value="${r.descricao}" placeholder="Item da posição ${j+1}">
                                    <button onclick="removerResposta(${i}, ${j})" class="btn-inline-remove">X</button>
                                </div>`;
                    });
                    html += `</div></div></div>`;
                }
                // 6: ARRASTAR E SOLTAR / DRAG AND DROP
                else if (p.tipo == 6) {
                    html += `
                    <div class="answers-container">
                        <button class="btn-add-item" onclick="addResposta(${i})">+ Adicionar Par Arrastável</button>
                        <div class="matching-container">`;
                    p.respostas.forEach((r, j) => {
                        html += `
                            <div class="matching-row">
                                <div class="match-box-left">
                                    <input class="inner-pill-input full-width" oninput="perguntas[${i}].respostas[${j}].texto_alvo = this.value" value="${r.texto_alvo}" placeholder="Texto Fixo (Caixa)">
                                </div>
                                <div class="match-arrow"></div>
                                <div class="match-box-right">
                                    <input class="inner-pill-input full-width" oninput="perguntas[${i}].respostas[${j}].descricao = this.value" value="${r.descricao}" placeholder="Arrastável (Resposta)">
                                </div>
                                <button onclick="removerResposta(${i}, ${j})" class="btn-inline-remove">X</button>
                            </div>`;
                    });
                    html += `</div></div>`;
                }

                div.innerHTML = html;
                container.appendChild(div);
            });
        }

        function updateTipo(i, tipoId) {
            perguntas[i].tipo = tipoId;
            perguntas[i].respostas = [];
            perguntas[i].resposta_texto = "";
            perguntas[i].vf = undefined;
            render();
        }

        function addResposta(i) {
            perguntas[i].respostas.push({ descricao: "", certo: false, texto_alvo: "" });
            render();
        }

        function removerResposta(i, j) {
            perguntas[i].respostas.splice(j, 1);
            render();
        }

        function removerPergunta(i) {
            confirmAdmin("Deseja apagar esta pergunta?", function() {
                perguntas.splice(i, 1);
                render();
            }, "REMOVER PERGUNTA");
        }

        function setCorreta(i, j, input) {
            if (perguntas[i].tipo == 1) {
                perguntas[i].respostas.forEach(r => r.certo = false);
            }
            perguntas[i].respostas[j].certo = input.checked;
        }

        function addPergunta() {
            perguntas.push({ descricao: "", tipo: "", respostas: [] });
            render();
        }

        async function salvarAlteracoes() {
            // 1. Impedir salvar quiz completamente sem perguntas
            if (!perguntas || perguntas.length === 0) {
                alertAdmin("O quiz deve conter pelo menos 1 pergunta! Se não deseja este quiz, apague-o no Painel do Administrador.", "AVISO");
                return;
            }

            // 2. Validação detalhada de perguntas e alternativas
            for (let i = 0; i < perguntas.length; i++) {
                let p = perguntas[i];

                if (!p.descricao || !p.descricao.trim()) {
                    alertAdmin(`A pergunta ${i + 1} está com a descrição vazia.`, "VALIDAÇÃO");
                    return;
                }
                if (!p.tipo) {
                    alertAdmin(`Selecione o tipo da pergunta ${i + 1}.`, "VALIDAÇÃO");
                    return;
                }

                if (p.tipo == 1 || p.tipo == 4 || p.tipo == 5 || p.tipo == 6) {
                    if (!p.respostas || p.respostas.length === 0) {
                        alertAdmin(`A pergunta ${i + 1} não possui nenhuma alternativa/resposta cadastrada.`, "VALIDAÇÃO");
                        return;
                    }

                    for (let j = 0; j < p.respostas.length; j++) {
                        if (!p.respostas[j].descricao || !p.respostas[j].descricao.trim()) {
                            alertAdmin(`Na pergunta ${i + 1}, a alternativa ${j + 1} está vazia.`, "VALIDAÇÃO");
                            return;
                        }
                        if (p.tipo == 6 && (!p.respostas[j].texto_alvo || !p.respostas[j].texto_alvo.trim())) {
                            alertAdmin(`Na pergunta ${i + 1}, o texto fixo/alvo ${j + 1} está vazio.`, "VALIDAÇÃO");
                            return;
                        }
                    }
                }

                if (p.tipo == 1) {
                    let corretas = p.respostas.filter(r => r.certo);
                    if (corretas.length !== 1) {
                        alertAdmin(`A pergunta ${i + 1} precisa ter exatamente 1 alternativa correta selecionada.`, "VALIDAÇÃO");
                        return;
                    }
                }

                if (p.tipo == 2 && (!p.resposta_texto || !p.resposta_texto.trim())) {
                    alertAdmin(`A pergunta ${i + 1} precisa de uma resposta de texto.`, "VALIDAÇÃO");
                    return;
                }

                if (p.tipo == 3 && p.vf === undefined) {
                    alertAdmin(`A pergunta ${i + 1} precisa da seleção de Verdadeiro ou Falso.`, "VALIDAÇÃO");
                    return;
                }
            }

            const payload = {
                id_quiz: quizId,
                nome: document.getElementById('input-nome').value,
                id_dificuldade: document.getElementById('select-dificuldade').value,
                id_conteudo: document.getElementById('select-conteudo').value,
                perguntas: perguntas
            };

            try {
                const response = await fetch("../config/atualizar_quiz.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const res = await response.json();
                
                if (res.status) {
                    alertAdmin(res.mensagem || "Quiz atualizado com sucesso!", "SUCESSO", function() {
                        window.location.reload();
                    });
                } else {
                    alertAdmin("Erro ao salvar: " + (res.erro || "Verifique os dados enviados."), "ERRO");
                }
            } catch (e) {
                alertAdmin("Erro ao conectar com o servidor.", "ERRO");
            }
        }
</script>
</body>
</html>
