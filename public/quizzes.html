<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
        body {
            font-family: Arial;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .card {
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 0 10px #ccc;
        }

        .titulo {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .info {
            font-size: 14px;
            margin-bottom: 5px;
        }
    </style>
<body>
    

<h2>Quizzes disponíveis</h2>

<div class="container" id="lista"></div>

<script>

const api = "../config/quiz.php";

window.onload = function () {
    carregarQuizzes();
}

function carregarQuizzes() {

    fetch(api + "?tipo=listar_quizzes")
    .then(r => r.json())
    .then(dados => {

        let html = "";

        dados.forEach(q => {

            html += `
                <div class="card" onclick="abrirQuiz(${q.id})">

                    <div class="titulo">${q.nome}</div>

                    <div class="info"><b>Matéria:</b> ${q.nome_materia}</div>
                    <div class="info"><b>Conteúdo:</b> ${q.conteudo}</div>
                    <div class="info"><b>Dificuldade:</b> ${q.dificuldade}</div>

                </div>
            `;
        });

        document.getElementById("lista").innerHTML = html;

    });

}

function abrirQuiz(id) {
    // próxima etapa
    window.location.href = "resolver_quiz.html?id=" + id;
}

</script>
</body>
</html>
