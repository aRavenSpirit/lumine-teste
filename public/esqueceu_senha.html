<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - LUMINE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./style/esqueceu_senha.css">
    <link rel="shortcut icon" href="img/LUMINE-5con.ico" type="image/x-icon">
    <script src="js/navegacao-teclado.js" defer></script>
    <script src="js/tamanho_fonte.js"></script>
</head>
<body>
    <div class="container-login">
        <div class="area-icone">
            <a href="index.php"><img src="img/LUMINE.png" alt="Logo" class="icone-site"></a>
        </div>

        <h1 class="titulo-log">Recuperar<br>Senha</h1>

        <p class="instrucao">
            Insira seu e-mail cadastrado para receber as instruções de recuperação.
        </p>

        <form id="formRecuperar" class="conteudo-form" onsubmit="enviarSolicitacao(event)">
            <div class="blocos-log">
                <div class="input-group">
                    <input type="email" name="email" placeholder="Email" id="email" required>
                </div>

                <div id="mensagem"></div>
            </div>

            <div class="area-botao">
                <button type="submit" class="botao-login">Enviar Link</button>
            </div>
        </form>

        <div class="divisor">
            <span>ou</span>
        </div>

        <p class="texto-cadastro">Lembrou a senha? <a href="login.html">Voltar para o Login</a></p>
    </div>

    <script>
        const emailInputEl = document.getElementById('email');
        emailInputEl.addEventListener('input', () => {
            const msg = document.getElementById("mensagem");
            msg.className = "";
            setTimeout(() => {
                if (!msg.classList.contains('caixa-erro') && 
                    !msg.classList.contains('caixa-sucesso') && 
                    !msg.classList.contains('caixa-info')) {
                    msg.innerHTML = "";
                }
            }, 400);
        });

        function exibirMensagem(texto, tipo) {
            const msg = document.getElementById("mensagem");
            msg.innerHTML = texto;
            msg.className = "caixa-" + tipo; // 'erro', 'sucesso' ou 'info'
        }

        function enviarSolicitacao(event) {
            if (event) event.preventDefault();

            const emailInput = document.getElementById('email').value.trim();

            if (!emailInput) {
                exibirMensagem("Por favor, preencha o campo de e-mail.", "erro");
                return;
            }

            exibirMensagem('<i class="fas fa-spinner fa-spin"></i> Verificando...', "info");

            fetch("/lumine-teste/config/solicitar_reset.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "email=" + encodeURIComponent(emailInput)
            })
            .then(async r => {
                const text = await r.text();
                console.log("Resposta bruta do servidor:", text);
                
                try {
                    return JSON.parse(text);
                } catch (jsonError) {
                    throw new Error("Erro de resposta do servidor (não é um JSON válido).");
                }
            })
            .then(d => {
                if (d.status) {
                    exibirMensagem('<i class="fas fa-check-circle"></i> ' + d.msg, "sucesso");
                } else {
                    exibirMensagem('<i class="fas fa-times-circle"></i> ' + d.msg, "erro");
                }
            })
            .catch(err => {
                console.error(err);
                exibirMensagem("Erro ao conectar com o servidor: " + err.message, "erro");
            });
        }
    </script>
</body>
</html>
