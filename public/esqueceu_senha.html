<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/tamanho_fonte.js"></script>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        main{
            display: flex;
            flex-direction: row;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            min-height: 100vh;
            width: 100vw;
        }

        .secao2{
            background-size: 3500px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Open_Sans', sans-serif;
            padding: 20px;
            background: linear-gradient( to left, rgb(227, 240, 254, 0.65), rgb(227, 240, 254, 0.65)), url('img/background-index.jpg');
        }

        .container-secao2{
            position: relative; 
            background-color: #ffffff;
            width: 100%;
            max-width: 480px; 
            border-radius: 30px;
            border: 4px solid #1595c4;
            padding: 60px 40px 40px 40px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .titulo{
             color: #333;
        }

        .titulo::after {
            content: '';
            display: block;
            width: 260px;
            height: 5px;
            background-color: #a3e1ff;
            border-radius: 10px;
            margin-top: 8px;
        }

        .instrucao{
            text-align: center; 
            margin-top: 45px; 
            color: #333;
        }

        form{
            display: flex;
            flex-direction: column;
            margin-top: 40px;
            padding: 5px;
            color: #333;
        }

        label{
            display: block;  
        }

        .input-box {
            display: flex;
            align-items: center;
            background-color: white;
            margin-bottom: 10px;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            padding-left: 10px;
            height: 40px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
        }

        .input-box i {
            color: #333;
            font-size: 16px;
        }

        .input-box input {
            border: none;
            outline: none;
            background: transparent;
            padding: 10px 20px;
            width: 100%;
            height: 100%;
            font-family: inherit;
            color: #333;
            margin-left: 10px;
        }

        .input-box:focus-within {
            border-color: #999;
        }

        .enviar{
            background-color: #a3e1ff;
            padding: 10px 55px;
            border-radius: 100px;
            box-shadow: 6px 6px 0px #1595c4;
            border: 3px solid #495861;
            font-size: 1.3rem;
            font-weight: bold;
            color: black;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 20px;
        }

        .enviar:hover{
            background-color: #8bd8ff;
            transform: scale(1.05);
        }

        #mensagem {
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <section class="secao2" style="width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center;">
            <div class="container-secao2">
                <h1 class="titulo">Recuperar Senha</h1>
                <p class="instrucao">
                    Insira seu e-mail cadastrado para receber as instruções de recuperação.
                </p>
                
                <form id="formRecuperar" onsubmit="enviarSolicitacao(event)">
                    <label for="email">Email:</label>
                    <div class="input-box">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Insira seu email" required>
                    </div>
            
                    <p id="mensagem"></p>
            
                    <button class="enviar" type="submit">Enviar Link</button>
                    
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="login.html" style="text-decoration: none; color: #333;">Voltar para o Login</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
    function enviarSolicitacao(event) {
        if (event) event.preventDefault(); // Evita recarregar a página ao submeter o formulário

        let msg = document.getElementById('mensagem');
        let emailInput = document.getElementById('email').value.trim();

        if (!emailInput) {
            msg.innerHTML = "Por favor, preencha o campo de e-mail.";
            msg.style.color = "#ff3636";
            return;
        }

        msg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
        msg.style.color = "#1595c4";

        fetch("/lumine-teste/config/solicitar_reset.php", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "email=" + encodeURIComponent(emailInput)
        })
        .then(async r => {
            const text = await r.text();
            console.log("Resposta bruta do servidor:", text);
            
            try {
                return JSON.parse(text);
            } catch (jsonError) {
                throw new Error("Erro de resposta do servidor (não é um JSON válido). Verifique o console.");
            }
        })
        .then(d => {
            if (d.status) {
                msg.innerHTML = '<i class="fas fa-check-circle"></i> ' + d.msg;
                msg.style.color = "#28a745";
            } else {
                msg.innerHTML = '<i class="fas fa-times-circle"></i> ' + d.msg;
                msg.style.color = "#ff3636";
            }
        })
        .catch(err => {
            console.error(err);
            msg.innerHTML = "Erro ao conectar com o servidor: " + err.message;
            msg.style.color = "#ff3636";
        });
    }
    </script>
</body>
</html>
